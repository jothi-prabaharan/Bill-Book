# Deploys the backend to Cloud Run and the frontends to Firebase Hosting.
#
# Manual, not on push. There is no released deployment yet and no staging
# environment to prove a change in first, so a deploy is a decision somebody
# makes rather than something that happens because a commit landed. Turning this
# into an on-push job is a one-line change when that stops being true.
#
# Every job here assumes `terraform apply` has already run at least once: this
# builds images, applies migrations and shifts traffic, but it does not create
# the project's infrastructure. That lives in deploy/gcp and is applied
# deliberately, because a workflow that could recreate a database instance is a
# workflow that could replace one.
name: Deploy — Google Cloud

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type the project id to confirm you mean this one'
        required: true
        type: string

concurrency:
  # Never two deploys at once. The second would push images and start a
  # migration job against a database the first is still migrating.
  group: deploy-gcp
  cancel-in-progress: false

env:
  REGION: asia-south1
  REPOSITORY: bill-book

permissions:
  contents: read
  # Workload Identity Federation mints a short-lived token from this, so there is
  # no service-account JSON key in the repository's secrets. A key that never
  # exists cannot leak, and this is the single most valuable line in the file.
  id-token: write

jobs:
  guard:
    name: Confirm target
    runs-on: ubuntu-latest
    steps:
      - name: Refuse a deploy aimed at the wrong project
        run: |
          if [ "${{ inputs.confirm }}" != "${{ vars.GCP_PROJECT_ID }}" ]; then
            echo "::error::Confirmation '${{ inputs.confirm }}' does not match the configured project."
            exit 1
          fi

  build:
    name: Build and push images
    needs: guard
    runs-on: ubuntu-latest

    strategy:
      # One image per service, in parallel. fail-fast off so a single broken
      # service does not hide whether the others build — on a deploy that has
      # already been decided, the useful output is the full list.
      fail-fast: false
      matrix:
        include:
          - service: master
            project: Api/Master/Master.Api
            assembly: Master.Api
          - service: accounting
            project: Api/Accounting/Accounting.Api
            assembly: Accounting.Api
          - service: inventory
            project: Api/Inventory/Inventory.Api
            assembly: Inventory.Api
          - service: sales
            project: Api/Sales/Sales.Api
            assembly: Sales.Api
          - service: purchase
            project: Api/Purchase/Purchase.Api
            assembly: Purchase.Api
          - service: customer
            project: Api/Customer/Customer.Api
            assembly: Customer.Api
          - service: reporting
            project: Api/Reporting/Reporting.Api
            assembly: Reporting.Api
          - service: gateway
            project: Gateway/Gateway.Api
            assembly: Gateway.Api
          - service: costing-worker
            project: worker/CostingEngine.Worker
            assembly: CostingEngine.Worker
          # Notification.Worker and RateSync.Worker are a .csproj and an empty
          # Consumers folder. They build, and deploying them would run a host
          # that does nothing — so they are left out until they do something,
          # rather than listed here to look complete.

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Authorize Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push
        working-directory: backend
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ matrix.service }}"

          # Tagged with the commit SHA, never "latest". A mutable tag makes two
          # revisions of the same service potentially different builds, and makes
          # a rollback a matter of hoping the tag still points where it did.
          docker build \
            -f Dockerfile . \
            --build-arg PROJECT="${{ matrix.project }}" \
            --build-arg ASSEMBLY="${{ matrix.assembly }}" \
            --tag "$IMAGE:${{ github.sha }}"

          docker push "$IMAGE:${{ github.sha }}"

  migrate:
    name: Apply migrations
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      # Once, as a job, before any new revision serves traffic.
      #
      # DatabaseMigrationService also migrates on Master's startup, which is fine
      # for one process and wrong for several: a deployment that cold-starts four
      # Master instances has four of them racing to apply the same migration. The
      # job makes it deterministic and makes a failure stop the deploy here,
      # rather than showing up as one unhealthy instance among several.
      - name: Run the migration job
        run: |
          gcloud run jobs update migrate \
            --region "${{ env.REGION }}" \
            --image "${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/master:${{ github.sha }}" \
            --quiet

          gcloud run jobs execute migrate \
            --region "${{ env.REGION }}" \
            --wait

  deploy:
    name: Shift traffic
    needs: migrate
    runs-on: ubuntu-latest

    strategy:
      # Sequential rather than parallel: the gateway must not start sending
      # traffic to a service that has not been updated, and max-parallel 1 with
      # gateway last is the cheapest way to guarantee the order without
      # orchestrating it.
      max-parallel: 1
      matrix:
        service:
          - master
          - accounting
          - inventory
          - sales
          - purchase
          - customer
          - reporting
          - costing-worker
          - gateway

    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy ${{ matrix.service }}
        run: |
          gcloud run deploy "${{ matrix.service }}" \
            --region "${{ env.REGION }}" \
            --image "${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ matrix.service }}:${{ github.sha }}" \
            --quiet

  frontend:
    name: Build and deploy the web apps
    needs: guard
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      # All five, under strictTemplates — the same gate CI runs. A deploy that
      # built only the app being shipped could ship one that compiles while a
      # library it shares is broken for another.
      - name: Build
        working-directory: frontend
        run: npm run build

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      # Firebase Hosting rather than a bucket behind a load balancer: these are
      # single-page applications, and Hosting rewrites unknown paths to
      # index.html without a URL map per app. A bucket needs that rewrite built
      # by hand and gets it wrong the first time on every deep link.
      - name: Deploy hosting
        run: |
          npm install --global firebase-tools

          # web and portal are the customer-facing pair; admin is the operator
          # console and docs is the manual. Each is its own Hosting site so they
          # can carry different domains and different access.
          for app in web portal admin docs; do
            firebase deploy \
              --only "hosting:$app" \
              --project "${{ vars.GCP_PROJECT_ID }}" \
              --non-interactive
          done
