<header class="page-head">
  <h1>Rates</h1>
</header>

@if (message()) {
  <p [class.error]="messageIsError()" [class.notice]="!messageIsError()" role="status">{{ message() }}</p>
}

<bb-info-tooltip text="Every customer's documents read these rates, so only an operator enters them. A rate entered for a date is used for that date and every later one until a newer rate is entered. A rate entered here outranks a fetched one on the same date."></bb-info-tooltip>

<section class="panel" aria-labelledby="exchange-heading">
  <h2 id="exchange-heading">Exchange rates</h2>

  @if (canEdit()) {
    <form class="fields" (ngSubmit)="saveExchange()">
      <bb-text-input label="From" name="from" [(ngModel)]="exchange.fromCurrencyCode" hint="1 unit of this currency" />
      <bb-text-input label="To" name="to" [(ngModel)]="exchange.toCurrencyCode" hint="is worth this many" />
      <bb-branch-date-input label="Date" name="exchangeDate" [(ngModel)]="exchange.rateDate" />
      <bb-number-input label="Rate" name="rate" [decimals]="8" [min]="0" [(ngModel)]="exchange.rate" />
      <div class="actions">
        <button class="btn btn-primary" type="submit" [disabled]="busy()">Save exchange rate</button>
      </div>
    </form>
  }

  <bb-data-grid fillHeight
    class="rates"
    [columns]="exchangeRowsColumns"
    [data]="exchangeRows()"
    stackOnPhone
    flush
    emptyText="No exchange rates yet."
  >
    <ng-template bbCellTemplate="fromCurrencyCode" let-row>
      1 {{ row.fromCurrencyCode }} = {{ row.toCurrencyCode }}
    </ng-template>
    <ng-template bbCellTemplate="col4" let-row>
      @if (canEdit() && row.source === 'Manual') {
        <button type="button" class="link" [disabled]="busy()" (click)="removeExchange(row)">Remove</button>
      }
    </ng-template>
  </bb-data-grid>
</section>

<section class="panel" aria-labelledby="metal-heading">
  <h2 id="metal-heading">Metal rates (INR per gram)</h2>

  @if (canEdit()) {
    <form class="fields" (ngSubmit)="saveMetal()">
      <bb-select label="Metal" name="metal" [options]="metals" [clearable]="false" [(ngModel)]="metal.metal" />
      <bb-text-input label="Purity" name="purity" [(ngModel)]="metal.purityCode" hint="As written in the trade: 24K, 22K, 999, 925" />
      <bb-branch-date-input label="Date" name="metalDate" [(ngModel)]="metal.rateDate" />
      <bb-number-input label="Rate per gram" name="ratePerGram" [decimals]="4" [min]="0" [(ngModel)]="metal.ratePerGram" />
      <div class="actions">
        <button class="btn btn-primary" type="submit" [disabled]="busy()">Save metal rate</button>
      </div>
    </form>
  }

  <bb-data-grid
    class="rates"
    [columns]="metalRowsColumns"
    [data]="metalRows()"
    stackOnPhone
    flush
    emptyText="No metal rates yet."
  >
    <ng-template bbCellTemplate="col5" let-row>
      @if (canEdit() && row.source === 'Manual') {
        <button type="button" class="link" [disabled]="busy()" (click)="removeMetal(row)">Remove</button>
      }
    </ng-template>
  </bb-data-grid>
</section>
