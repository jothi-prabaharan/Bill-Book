<div class="card" style="grid-column:span 3">
  <div style="display:flex;align-items:baseline;justify-content:space-between;gap:var(--space-2)">
    <div class="card-kicker" style="margin:0">{{ account.name }}</div>
    <span class="tag tag-outline" style="font-variant-numeric:tabular-nums;letter-spacing:.08em">{{ account.ccy }}</span>
  </div>
  <div class="card-title" style="font-variant-numeric:tabular-nums">{{ account.balText }}</div>
  <svg viewBox="0 0 220 76" style="width:100%;height:auto;margin-top:var(--space-2)" role="img" [attr.aria-label]="account.chartLabel">
    <line x1="0" y1="68" x2="220" y2="68" stroke="var(--color-divider)"></line>
    <line x1="0" y1="38" x2="220" y2="38" stroke="var(--color-divider)" stroke-dasharray="2 4"></line>
    <polyline [attr.points]="account.book" fill="none" stroke="var(--color-accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></polyline>
    <polyline [attr.points]="account.stmt" fill="none" stroke="var(--color-neutral-600)" stroke-width="1.5" stroke-dasharray="4 3" stroke-linejoin="round" stroke-linecap="round"></polyline>
  </svg>
  <div style="display:flex;justify-content:space-between;font-size:11px" class="text-muted"><span>Mar</span><span>Aug &middot; {{ account.ccy }}</span></div>
  <div style="display:flex;flex-wrap:wrap;gap:var(--space-3);font-size:11px;margin-top:var(--space-1)">
    <span style="display:flex;align-items:center;gap:5px"><span style="width:12px;height:2px;background:var(--color-accent)"></span>{{ account.seriesLabel }}</span>
    <span style="display:flex;align-items:center;gap:5px"><span style="width:12px;height:2px;background:var(--color-neutral-600)"></span>{{ account.stmtText }}</span>
  </div>
  <div class="card-meta">{{ account.metaText }}</div>
</div>
