@if (visible()) {
  <div
    class="msgbox"
    [class.msgbox--error]="boxTone() === 'error'"
    [class.msgbox--warning]="boxTone() === 'warning'"
    [class.msgbox--success]="boxTone() === 'success'"
    [class.msgbox--info]="boxTone() === 'info'"
    role="status"
    [attr.aria-live]="liveness()"
    [attr.aria-label]="label()"
  >
    <div class="msgbox__body">
      @if (hasMessages()) {
        <ul class="msgbox__list">
          @for (message of messages(); track message.text) {
            <li class="msgbox__item">
              <span class="msgbox__text">{{ message.text }}</span>

              @if (message.detail?.length) {
                <ul class="msgbox__detail">
                  @for (line of message.detail; track line) {
                    <li>{{ line }}</li>
                  }
                </ul>
              }
            </li>
          }
        </ul>
      }

      @if (tone() !== null) {
        <div class="msgbox__content"><ng-content /></div>
      }
    </div>

    @if (dismissible()) {
      <button
        type="button"
        class="msgbox__dismiss"
        aria-label="Dismiss these messages"
        (click)="dismiss.emit()"
      >
        &times;
      </button>
    }
  </div>
}
