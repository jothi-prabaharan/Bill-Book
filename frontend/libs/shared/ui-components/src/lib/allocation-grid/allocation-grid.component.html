<div class="allocation-grid-container">
  <div class="allocation-header">
    @if (showSummary) {
      <div class="summary-info">
        <div>Amount to Allocate: <strong>{{ money(amountToAllocate) }}</strong></div>
        <div>Allocated: <strong>{{ money(totalAllocated) }}</strong></div>
        <div>Remaining: <strong>{{ money(remainingToAllocate) }}</strong></div>
      </div>
    }
    <button class="secondary" (click)="autoAllocate()" [disabled]="amountToAllocate <= 0 || rows.length === 0">Auto Allocate</button>
  </div>

  <bb-data-grid
    flush
    label="Documents to allocate against"
    [columns]="columns"
    [data]="rows"
    [rowClass]="rowClass"
    [sortable]="false"
    [showColumnFilters]="false"
    [showCount]="false"
    [paged]="false"
    emptyText="No outstanding documents found."
  >
    <ng-template bbCellTemplate="documentDate" let-row>{{ date(row.documentDate) }}</ng-template>
    <ng-template bbCellTemplate="dueDate" let-row>{{ date(row.dueDate) }}</ng-template>
    <ng-template bbCellTemplate="totalAmount" let-row>{{ money(row.totalAmount) }}</ng-template>
    <ng-template bbCellTemplate="outstandingAmount" let-row>{{ money(row.outstandingAmount) }}</ng-template>
    <ng-template bbCellTemplate="allocatedAmount" let-row let-i="index">
      <bb-money-input
        class="amount-input"
        align="right"
        [formats]="formats"
        [min]="0"
        [max]="row.outstandingAmount"
        [ariaLabel]="'Allocate to ' + row.documentNo"
        [ngModel]="row.allocatedAmount"
        [ngModelOptions]="{ standalone: true }"
        (ngModelChange)="onAllocateChange(i, $event ?? 0)"
      />
    </ng-template>
  </bb-data-grid>
</div>
