<div
  class="search-group"
  [class.has-value]="innerValue().length > 0"
  [class.disabled]="effectiveDisabled()"
>
  <span class="search-icon" aria-hidden="true">
    <svg
      width="16"
      height="16"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <circle cx="11" cy="11" r="8"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
  </span>
  <input
    type="search"
    class="input search-input"
    [id]="id() || null"
    [name]="name() || null"
    [placeholder]="placeholder()"
    [disabled]="effectiveDisabled()"
    [attr.aria-label]="ariaLabel()"
    [value]="innerValue()"
    (input)="onInput($event)"
    (keydown)="onKeyDown($event)"
    (blur)="onBlur()"
  />
  @if (innerValue().length > 0 && !effectiveDisabled()) {
    <button
      type="button"
      class="clear-btn"
      aria-label="Clear search"
      (click)="onClear()"
    >
      <svg
        width="14"
        height="14"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  }
</div>
