@if (label()) {
  @if (labelAsCaption()) {
    <span class="field-label">
      {{ label() }}
      @if (required()) {
        <span class="field-required" aria-hidden="true">*</span>
      }
      @if (showHint()) {
        <bb-info-tooltip [text]="hint()!"></bb-info-tooltip>
      }
    </span>
  } @else {
    <label class="field-label" [attr.for]="controlId() || null">
      {{ label() }}
      @if (required()) {
        <span class="field-required" aria-hidden="true">*</span>
      }
      @if (showHint()) {
        <bb-info-tooltip [text]="hint()!"></bb-info-tooltip>
      }
    </label>
  }
} @else if (showHint()) {
  <div style="display: flex; justify-content: flex-end; margin-bottom: 0.2rem;">
    <bb-info-tooltip [text]="hint()!"></bb-info-tooltip>
  </div>
}

<ng-content />

@if (error()) {
  <!-- role="alert" so a screen reader announces the refusal as it appears,
       rather than only when the field is next visited. -->
  <span class="field-error" role="alert" [attr.id]="errorId() || null">{{ error() }}</span>
}
