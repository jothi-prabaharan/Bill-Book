<bb-form-field
  [label]="label()"
  [controlId]="controlId()"
  [required]="required()"
  [hint]="hint()"
  [error]="error()"
  [hintId]="hintId()"
  [errorId]="errorId()"
>
  <div class="bb-password">
    <input
      class="input bb-password__field"
      [type]="fieldType()"
      [id]="controlId()"
      [name]="name() || null"
      [placeholder]="placeholder()"
      [attr.minlength]="minlength()"
      [attr.maxlength]="maxlength()"
      [attr.autocomplete]="resolvedAutocomplete()"
      [disabled]="effectiveDisabled()"
      [readonly]="readonly()"
      [required]="required()"
      [attr.aria-label]="effectiveAriaLabel()"
      [attr.aria-invalid]="invalid() ? 'true' : null"
      [attr.aria-describedby]="describedBy()"
      [value]="innerValue()"
      (input)="onInput($event)"
      (keydown)="onKeyDown($event)"
      (blur)="onBlur($event)"
      (focus)="onFocus($event)"
    />

    @if (allowReveal()) {
      <!-- An icon-only control needs a name of its own, and the name has to say
           what pressing it will do rather than what the field currently is. -->
      <button
        type="button"
        class="bb-password__toggle"
        [attr.aria-label]="toggleLabel()"
        [attr.aria-pressed]="revealed()"
        [attr.aria-controls]="controlId()"
        [disabled]="effectiveDisabled()"
        (click)="toggleReveal()"
      >
        @if (revealed()) {
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
            <path d="m1 1 22 22" />
          </svg>
        } @else {
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z" />
            <circle cx="12" cy="12" r="3" />
          </svg>
        }
      </button>
    }
  </div>
</bb-form-field>
