<div
  class="flex-1 min-h-0 overflow-hidden flex flex-col"
  [class.card]="!flush()"
  [class.bg-surface]="!flush()"
  [class.p-0]="!flush()"
  [class.gap-0]="!flush()"
>
  <div style="overscroll-behavior: contain" class="listwrap flex-1 min-h-0 overflow-auto">
    <table
      style="border-collapse: collapse"
      class="text-13 table w-full text-left"
      [attr.aria-label]="label() || null"
    >
      <ng-content />
    </table>
  </div>
</div>
