<div class="master-select-container">
  <select class="input flex-1" [ngModel]="innerValue()" (ngModelChange)="onSelect($event)" [disabled]="disabled()">
    <option [ngValue]="null">Select {{ label() || masterType() }}</option>
    @for (opt of options(); track getOptionValue(opt)) {
      <option [ngValue]="getOptionValue(opt)">{{ getOptionLabel(opt) }}</option>
    }
  </select>
  <button type="button" class="btn btn-secondary add-btn" (click)="onCreateClick()" title="Create new">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>
</div>
