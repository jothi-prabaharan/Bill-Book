<div class="data-grid-card" [class.compact]="compact" [class.flush]="flush" [class.fill-height]="fillHeight">
  <!-- Progress bar for loading state -->
  <div *ngIf="loading" class="data-grid-loading-bar" aria-hidden="true">
    <div class="loading-pulse"></div>
  </div>

  <!-- Above the table sit only a Clear button and the visible-row count: no
       list-level search, no status select, no filter toggle. -->
  <div *ngIf="showCount" class="grid-bar">
    <button *ngIf="isNarrowed()"
            type="button"
            class="btn btn-ghost grid-clear"
            (click)="clearAll()">Clear</button>
    <span class="grid-count">{{ visibleRowCount() }} shown</span>
  </div>

  <div class="listwrap" [class.compact]="compact">
    <table class="table" [class.compact]="compact" [class.table--stacked]="stackOnPhone" [attr.aria-label]="label || null">
      <thead>
        <tr>
          <th *ngFor="let col of visibleColumns(); let last = last"
              scope="col"
              [class.numeric]="isNumericCol(col)"
              [style.width]="col.width"
              class="relative">
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 4px;">
              <div style="display: flex; align-items: center; min-width: 0;">
                <button *ngIf="headerOf(col) && sortable && col.sortable !== false; else plainHeader"
                        type="button"
                        class="table-sort-btn"
                        (click)="onSort(col)"
                        [attr.aria-sort]="sortField() === col.field ? (sortDirection() === 'asc' ? 'ascending' : 'descending') : 'none'">
                  <span class="truncate">{{ headerOf(col) }}</span>
                  <span class="sort-indicator" [class.active]="sortField() === col.field">
                    <span *ngIf="sortField() === col.field && sortDirection() === 'asc'" aria-label="sorted ascending">▲</span>
                    <span *ngIf="sortField() === col.field && sortDirection() === 'desc'" aria-label="sorted descending">▼</span>
                    <span *ngIf="sortField() !== col.field" class="sort-idle">↕</span>
                  </span>
                </button>
                <ng-template #plainHeader>
                  <span class="truncate">{{ headerOf(col) }}</span>
                </ng-template>
              </div>

              <div *ngIf="headerOf(col) && showColumnFilters && col.filterable !== false" style="position: relative;">
                <button type="button" 
                        cdkOverlayOrigin #filterTrigger="cdkOverlayOrigin"
                        class="btn-icon" 
                        [style.color]="columnFilter(col.field) ? 'var(--color-accent-700)' : 'var(--color-neutral-400)'"
                        [style.background]="openFilterField() === col.field ? 'var(--color-neutral-100)' : 'transparent'"
                        style="padding: 4px; border-radius: 4px; border: 0; cursor: pointer; display: flex;"
                        title="Filter"
                        (click)="toggleFilter(col.field, $event)">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
                  </svg>
                </button>

                <!-- Filter Popover -->
                <ng-template cdkConnectedOverlay 
                             [cdkConnectedOverlayOrigin]="filterTrigger" 
                             [cdkConnectedOverlayOpen]="openFilterField() === col.field"
                             (overlayOutsideClick)="openFilterField.set(null)">
                  <div class="popover"
                       style="width: 240px; font-weight: normal; text-transform: none; text-align: left; position: relative; top: 0; right: 0; left: 0; margin-top: 6px; box-shadow: var(--shadow-lg);">
                    <div class="popover-head">
                      <div class="popover-title">Filter {{ headerOf(col) }}</div>
                    </div>
                    <div class="popover-body">
                      <select class="input" style="margin-bottom: var(--space-2);" [ngModel]="filterOp()" (ngModelChange)="filterOp.set($event)">
                        <option value="contains">Contains</option>
                        <option value="equals">Equals</option>
                        <option value="starts">Starts with</option>
                      </select>
                      <input type="search" class="input" placeholder="Search value..." 
                             [ngModel]="filterVal()" (ngModelChange)="filterVal.set($event)"
                             (keyup.enter)="applyFilter(col.field, $event)" />
                    </div>
                    <div class="popover-foot" style="justify-content: flex-end;">
                      <button type="button" class="btn btn-secondary" style="padding: 4px 12px; height: 32px;" (click)="clearFilter(col.field, $event)">Clear</button>
                      <button type="button" class="btn btn-primary" style="padding: 4px 12px; height: 32px;" (click)="applyFilter(col.field, $event)">Apply</button>
                    </div>
                  </div>
                </ng-template>
              </div>
            </div>
          </th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let row of displayData(); let index = index"
            bb-data-grid-row
            [row]="row"
            [index]="index"
            [visibleColumns]="visibleColumns()"
            [templates]="templateMap"
            [ngClass]="rowClass ? rowClass(row) : null"
            [class.clickable-row]="clickable"
            [class.cursor-pointer]="clickable"
            (rowClick)="onRowClick($event)">
        </tr>

        <!-- Empty State -->
        <tr *ngIf="!loading && displayData().length === 0" class="empty-state-row">
          <td [attr.colspan]="visibleColumns().length" class="text-center text-muted p-4">
            <ng-container *ngIf="emptyTemplate || contentEmptyTemplate; else defaultEmpty">
              <ng-container *ngTemplateOutlet="emptyTemplate || contentEmptyTemplate"></ng-container>
            </ng-container>
            <ng-template #defaultEmpty>{{ emptyText }}</ng-template>
          </td>
        </tr>
      </tbody>
      <tfoot *ngIf="footer">
        <ng-container *ngTemplateOutlet="footer.template; context: { $implicit: displayData() }"></ng-container>
      </tfoot>
    </table>
  </div>

  <!-- Pagination Strip -->
  <div *ngIf="showPager()" class="table-pagination">
    <span class="text-muted pagination-summary">
      {{ paginationSummary() }}
    </span>
    <div class="pagination-actions flex gap-2">
      <button type="button"
              class="btn btn-secondary pagination-btn"
              [disabled]="currentPage <= 1"
              (click)="prevPage()">Previous</button>
      <button type="button"
              class="btn btn-secondary pagination-btn"
              [disabled]="currentPage >= totalPages()"
              (click)="nextPage()">Next</button>
    </div>
  </div>
</div>
