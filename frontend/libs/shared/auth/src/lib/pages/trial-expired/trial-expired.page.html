<div class="auth-card">
  <h1>Your trial has expired</h1>
  <p>Your data is safe, but access is paused until you renew.</p>
  <div class="actions">
    <button type="button" (click)="renew()">Renew / Upgrade</button>
    <button type="button" class="link" (click)="logout()">Sign out</button>
  </div>
</div>
