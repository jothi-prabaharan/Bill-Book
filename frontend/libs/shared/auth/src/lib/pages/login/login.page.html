<div class="auth-card">
  <h1>Bill-Book</h1>

  @if (step() === 'credentials') {
    <form #loginForm="ngForm" (ngSubmit)="submit(loginForm)">
      <label>
        Email
        <input name="email" type="email" [(ngModel)]="email" required autocomplete="username" />
      </label>
      <label>
        Password
        <input name="password" type="password" [(ngModel)]="password" required autocomplete="current-password" />
      </label>

      @if (error()) {
        <p class="error">{{ error() }}</p>
      }

      <button type="submit" [disabled]="busy()">{{ busy() ? 'Signing in…' : 'Sign in' }}</button>
    </form>
    <p><a routerLink="/forgot-password">Forgot password?</a></p>
    <p>New here? <a routerLink="/signup">Start a free trial</a></p>
  } @else {
    <h2>Choose an organization</h2>
    <ul class="org-list">
      @for (org of auth.organizations(); track org.orgId) {
        <li>
          <button type="button" (click)="pick(org.orgId)" [disabled]="busy()">
            <strong>{{ org.orgName }}</strong>
            <span>{{ org.roleName }}</span>
          </button>
        </li>
      }
    </ul>
    @if (error()) {
      <p class="error">{{ error() }}</p>
    }
  }
</div>
