<div class="p-4 flex h-screen bg-gray-50">
  <div class="w-2/3 pr-4 border-r">
    <h1 class="text-2xl font-bold mb-4">Menu Items</h1>
    <div class="grid grid-cols-3 gap-4">
      <div *ngFor="let item of menuItems" 
           class="bg-white p-4 rounded shadow cursor-pointer hover:bg-gray-50 border"
           tabindex="0"
           (click)="addItemToOrder(item)"
           (keyup.enter)="addItemToOrder(item)">
        <div class="font-bold">{{item.menuItemId}}</div>
        <div class="text-gray-500 text-sm">Add to cart</div>
      </div>
    </div>
  </div>
  
  <div class="w-1/3 pl-4 flex flex-col">
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-xl font-bold">Current Order</h2>
      <span class="bg-blue-100 text-blue-800 text-xs px-2 py-1 rounded" *ngIf="currentOrder">
        {{currentOrder.orderNumber || 'Draft'}}
      </span>
    </div>

    <div class="flex gap-2 mb-4" *ngIf="!currentOrder">
      <button class="bg-blue-600 text-white px-4 py-2 rounded flex-1 font-medium hover:bg-blue-700" (click)="openNewOrder()">
        Start New Order
      </button>
    </div>

    <div *ngIf="currentOrder" class="flex-1 overflow-y-auto">
      <div class="flex gap-2 mb-4">
        <button class="border p-2 rounded flex-1 bg-white hover:bg-gray-50" (click)="updateOrderType(1)" [class.bg-blue-50]="currentOrder.orderType === 1">Dine In</button>
        <button class="border p-2 rounded flex-1 bg-white hover:bg-gray-50" (click)="updateOrderType(2)" [class.bg-blue-50]="currentOrder.orderType === 2">Takeaway</button>
      </div>

      <div class="space-y-2 mb-4">
        <div *ngFor="let line of orderLines" class="bg-white p-3 rounded shadow-sm border flex justify-between items-center">
          <div>
            <div class="font-medium">Item #{{line.menuItemId}}</div>
            <div class="text-sm text-gray-500">{{line.quantity}} x {{line.unitPrice}}</div>
          </div>
          <button class="text-red-500 hover:bg-red-50 p-2 rounded" (click)="removeLine(line)">
            Remove
          </button>
        </div>
        
        <div *ngIf="orderLines.length === 0" class="text-center text-gray-500 py-8 border-2 border-dashed rounded">
          Cart is empty
        </div>
      </div>
      
      <div class="mt-auto border-t pt-4">
        <div class="flex justify-between font-bold text-lg mb-4">
          <span>Total:</span>
          <span>{{currentOrder.totalAmount}}</span>
        </div>
      </div>
    </div>
  </div>
</div>
