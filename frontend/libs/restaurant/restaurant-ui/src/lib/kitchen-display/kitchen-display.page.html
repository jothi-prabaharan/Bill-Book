<div class="p-4 bg-gray-900 min-h-screen text-white">
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-3xl font-bold text-yellow-400">Kitchen Display System</h1>
    <div class="flex gap-4 items-center">
      <span class="text-gray-400">Station:</span>
      <div class="flex gap-2">
        <button class="bg-gray-800 rounded p-2 text-white border border-gray-700" [class.bg-blue-600]="currentStation===1" (click)="setStation(1)">Hot Kitchen</button>
        <button class="bg-gray-800 rounded p-2 text-white border border-gray-700" [class.bg-blue-600]="currentStation===2" (click)="setStation(2)">Cold Kitchen</button>
        <button class="bg-gray-800 rounded p-2 text-white border border-gray-700" [class.bg-blue-600]="currentStation===3" (click)="setStation(3)">Bar</button>
        <button class="bg-gray-800 rounded p-2 text-white border border-gray-700" [class.bg-blue-600]="currentStation===4" (click)="setStation(4)">Dessert</button>
      </div>
    </div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
    <div *ngFor="let ticket of tickets" class="bg-gray-800 rounded-lg shadow-lg border border-gray-700 overflow-hidden">
      <div class="bg-gray-700 px-4 py-2 border-b border-gray-600 flex justify-between items-center">
        <span class="font-bold text-lg text-white">#{{ticket.kotNumber}}</span>
        <span class="text-sm bg-blue-600 px-2 py-1 rounded">Table {{ticket.restaurantTableId || 'N/A'}}</span>
      </div>
      
      <div class="p-4 space-y-3">
        <div *ngFor="let line of ticket.lines" class="flex justify-between items-start border-b border-gray-700 pb-2 last:border-0">
          <div>
            <span class="font-bold text-lg mr-2">{{line.quantity}}x</span>
            <span>Item #{{line.menuItemId}}</span>
            <div *ngIf="line.notes" class="text-yellow-400 text-sm mt-1">Note: {{line.notes}}</div>
          </div>
          
          <button *ngIf="line.status === 1" class="px-3 py-1 bg-yellow-600 hover:bg-yellow-500 rounded text-sm font-medium" (click)="updateStatus(line, 2)">Start</button>
          <button *ngIf="line.status === 2" class="px-3 py-1 bg-green-600 hover:bg-green-500 rounded text-sm font-medium" (click)="updateStatus(line, 3)">Done</button>
          <span *ngIf="line.status === 3" class="text-green-400 text-sm italic">Ready</span>
          <span *ngIf="line.status === 5" class="text-red-400 text-sm italic">Cancelled</span>
        </div>
      </div>
    </div>
    
    <div *ngIf="tickets.length === 0" class="col-span-full py-12 text-center text-gray-500 text-xl">
      No active orders for this station.
    </div>
  </div>
</div>
