<div class="page-container">
  <header class="page-header">
    <h1>{{ isEdit ? 'Edit Credit Note' : 'New Credit Note' }}</h1>
    <button class="primary" (click)="save()">Save</button>
  </header>

  <form [formGroup]="form" class="form-grid">
    <div class="field">
      <label for="docDate">Document Date</label>
      <bb-date-input id="docDate"  class="input" formControlName="documentDate" />
    </div>
    <div class="field">
      <label for="invoiceId">Invoice (ID)</label>
      <bb-text-input id="invoiceId"  class="input" formControlName="invoiceId" />
    </div>
    <div class="field">
      <label for="contactId">Contact (ID)</label>
      <bb-number-input id="contactId"  class="input" formControlName="contactId" />
    </div>
    <div class="field">
      <label for="reasonCode">Reason Code</label>
      <select id="reasonCode" formControlName="reasonCode">
        <option [value]="1">Sales Return</option>
        <option [value]="2">Post Sale Discount</option>
        <option [value]="3">Deficiency in Services</option>
        <option [value]="4">Correction in Invoice</option>
        <option [value]="5">Change in POS</option>
        <option [value]="6">Finalization of Provisional Assessment</option>
        <option [value]="7">Others</option>
      </select>
    </div>
    <div class="field">
      <label for="currencyCode">Currency</label>
      <bb-text-input id="currencyCode" formControlName="currencyCode" maxlength="3" />
    </div>
    <div class="field">
      <label for="exchangeRate">Exchange Rate</label>
      <bb-text-input id="exchangeRate" formControlName="exchangeRate" step="0.01" />
    </div>
    <div class="field">
      <label for="billingAddress">Billing Address</label>
      <textarea id="billingAddress" formControlName="billingAddress" rows="2"></textarea>
    </div>
    <div class="field">
      <label for="shippingAddress">Shipping Address</label>
      <textarea id="shippingAddress" formControlName="shippingAddress" rows="2"></textarea>
    </div>
    <div class="field full-width">
      <label for="notes">Notes</label>
      <textarea id="notes" formControlName="notes" rows="2"></textarea>
    </div>
  </form>

  <div class="line-grid-container">
    <bb-document-line-grid
      [lines]="lines"
      [context]="context"
      (linesChange)="onLinesChange($event)"
      (pickItem)="onPickItem($event)"
    ></bb-document-line-grid>
  </div>
</div>
