<section class="sor-list">
  <header class="sor-list__head">
    <h1 class="sor-list__title">Sales orders</h1>

    <button type="button" class="btn btn-primary" (click)="create()">New sales order</button>
  </header>

  <!-- Anything the server refused. Field-level problems never reach here; this
       is where a rule about the request itself is shown. -->
  <bb-message-box [messages]="messages()" />

  <form class="sor-list__filters" (ngSubmit)="onFilterChange()">
    <nav aria-label="Status filters" class="flex flex-wrap gap-6px mr-4">
      <button type="button" (click)="status = ''; onFilterChange()" [attr.aria-pressed]="status === ''" class="btn btn-secondary text-sm tab-all">All statuses</button>
      
      <span class="tabgrp">
        <button class="btn btn-secondary text-sm" type="button" (click)="status = 'Draft'; onFilterChange()" [attr.aria-pressed]="status === 'Draft'">Draft</button>
      </span>

      <span class="tabgrp">
        <button class="btn btn-secondary text-sm" type="button" (click)="status = 'ReadyToPost'; onFilterChange()" [attr.aria-pressed]="status === 'ReadyToPost'">Ready to confirm</button>
      </span>

      <span class="tabgrp">
        <button class="btn btn-secondary text-sm" type="button" (click)="status = 'Posted'; onFilterChange()" [attr.aria-pressed]="status === 'Posted'">Confirmed</button>
      </span>

      <span class="tabgrp">
        <button class="btn btn-secondary text-sm" type="button" (click)="status = 'Void'; onFilterChange()" [attr.aria-pressed]="status === 'Void'">Void</button>
      </span>
    </nav>

    <div class="field sor-list__filter sor-list__filter--grow">
      <bb-search-input
        id="sor-search"
        label="Order number"
        name="search"
        placeholder="SO/2026/0001"
        [debounceMs]="0"
        [(ngModel)]="search"
      />
    </div>

    <button type="submit" class="btn btn-secondary sor-list__apply">Search</button>
  </form>

  <div class="card bg-surface sor-list__grid">
    <bb-data-grid fillHeight
      [gridCode]="'SALES_ORDER_LIST'"
      [columns]="columns"
      [data]="rows()"
      [loading]="loading()"
      [totalCount]="total()"
      [pageSize]="pageSize"
      [currentPage]="page()"
      (pageChange)="onPageChange($event)"
      (rowClick)="open($event)"
    >
      <ng-template bbCellTemplate="documentNo" let-row>
        <span class="tabular-nums">{{ row.documentNo }}</span>

        @if (row.quoteId) {
          <span class="chip" title="Converted from a quote">from quote</span>
        }
      </ng-template>

      <ng-template bbCellTemplate="status" let-row>
        <span [class]="statusTag(row.status)">{{ row.status }}</span>
      </ng-template>
    </bb-data-grid>

    @if (isEmpty()) {
      <p class="sor-list__empty">
        No sales orders match. Clear the filters, or raise one from an accepted quote.
      </p>
    }
  </div>
</section>
