<bb-register-header title="Sales orders" code="SOR" [count]="periodCount()" newLabel="New sales order" (create)="create()" />

<!-- Anything the server refused. Field-level problems never reach here; this
     is where a rule about the request itself is shown. -->
<bb-message-box [messages]="messages()" />

<bb-status-tabs label="Status filters" [tabs]="tabs()" [value]="status" (valueChange)="setStatus($event)" />

<section class="register-card">
  <bb-period-filter-bar initialPreset="this-financial-year" [total]="totalBase()" (rangeChange)="setRange($event)">
    <bb-search-input
      class="sor-list__search"
      id="sor-search"
      ariaLabel="Order number"
      name="search"
      placeholder="Order number"
      [debounceMs]="400"
      [mobileButton]="true"
      [(ngModel)]="search"
      (ngModelChange)="onFilterChange()"
    />
  </bb-period-filter-bar>

  <bb-data-grid
    register
    fillHeight
    flush
    stackOnPhone
    label="Sales orders"
    emptyText="No sales orders match. Clear the filters, or raise one from an accepted quote."
    [gridCode]="gridCode"
    [columns]="columns"
    [data]="rows()"
    [loading]="loading()"
    [totalCount]="total()"
    [pageSize]="pageSize()"
    [currentPage]="page()"
    (pageChange)="onPageChange($event)"
    (pageSizeChange)="onPageSizeChange($event)"
    (rowClick)="open($event)"
  >
    <ng-template bbCellTemplate="documentNo" let-row>
      <bb-doc-number code="SOR" [number]="row.documentNo" />

      @if (row.quoteId) {
        <span class="chip" title="Converted from a quote">from quote</span>
      }
    </ng-template>

    <ng-template bbCellTemplate="documentDate" let-row>
      <span class="reg-date">{{ row.documentDate | registerDate }}</span>
    </ng-template>

    <ng-template bbCellTemplate="deliveryDate" let-row>
      <span class="tabular-nums">{{ row.deliveryDate | registerDate }}</span>
    </ng-template>

    <ng-template bbCellTemplate="status" let-row>
      <span [class]="'tag ' + statusTone(row.status)">{{ statusLabel(row.status) }}</span>
    </ng-template>

    <ng-template bbCellTemplate="fulfilmentStatus" let-row>
      <span [class]="'tag ' + statusTone(row.fulfilmentStatus)">{{ row.fulfilmentStatus }}</span>
    </ng-template>

    <ng-template bbCellTemplate="taxableAmount" let-row>
      <bb-money-cell [value]="row.taxableAmount" />
    </ng-template>

    <ng-template bbCellTemplate="totalAmount" let-row>
      <bb-money-cell [value]="row.totalAmount" [currency]="row.currencyCode" />
    </ng-template>
  </bb-data-grid>
</section>
