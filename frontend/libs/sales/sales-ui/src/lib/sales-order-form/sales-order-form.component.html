<div class="page-container">
  <header class="page-header">
    <h1>{{ isEdit ? 'Edit Sales Order' : 'New Sales Order' }}</h1>
    <button class="primary" (click)="save()">Save</button>
  </header>

  <form [formGroup]="form" class="form-grid">
    <div class="form-group">
      <label for="documentDate">Date</label>
      <input id="documentDate" formControlName="documentDate">
    </div>
    <div class="form-group">
      <label for="deliveryDate">Delivery Date</label>
      <input id="deliveryDate" formControlName="deliveryDate">
    </div>
    <div class="form-group">
      <label for="contactId">Contact (ID)</label>
      <input id="contactId" formControlName="contactId">
    </div>
    <div class="form-group">
      <label for="contactGstin">Contact GSTIN</label>
      <input id="contactGstin" formControlName="contactGstin" maxlength="15">
    </div>
    <div class="form-group">
      <label for="placeOfSupplyStateCode">Place of Supply State Code</label>
      <input id="placeOfSupplyStateCode" formControlName="placeOfSupplyStateCode" maxlength="2">
    </div>
    <div class="form-group">
      <label for="currencyCode">Currency</label>
      <input id="currencyCode" formControlName="currencyCode" maxlength="3">
    </div>
    <div class="form-group">
      <label for="exchangeRate">Exchange Rate</label>
      <input id="exchangeRate" formControlName="exchangeRate" step="0.01">
    </div>
    <div class="form-group">
      <label for="billingAddress">Billing Address</label>
      <textarea id="billingAddress" formControlName="billingAddress" rows="2"></textarea>
    </div>
    <div class="form-group">
      <label for="shippingAddress">Shipping Address</label>
      <textarea id="shippingAddress" formControlName="shippingAddress" rows="2"></textarea>
    </div>
    <div class="form-group full-width">
      <label for="notes">Notes</label>
      <textarea id="notes" formControlName="notes" rows="2"></textarea>
    </div>
    <div class="form-group full-width">
      <label for="termsAndConditions">Terms and Conditions</label>
      <textarea id="termsAndConditions" formControlName="termsAndConditions" rows="2"></textarea>
    </div>
  </form>

  <div class="line-grid-container">
    <bb-document-line-grid
      [lines]="lines"
      [context]="context"
      (linesChange)="onLinesChange($event)"
      (pickItem)="onPickItem($event)"
    ></bb-document-line-grid>
  </div>
</div>
