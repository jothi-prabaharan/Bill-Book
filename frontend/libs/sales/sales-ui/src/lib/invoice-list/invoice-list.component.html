<div class="page-container">
  <header class="page-header">
    <h1>Invoices</h1>
    <button class="primary" routerLink="new">New Invoice</button>
  </header>
  
  <table class="data-table">
    <thead>
      <tr>
        <th>Document No</th>
        <th>Date</th>
        <th>Customer</th>
        <th>Due Date</th>
        <th>Amount</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let inv of invoices">
        <td><a [routerLink]="[inv.invoiceId]">{{ inv.documentNo }}</a></td>
        <td>{{ inv.documentDate }}</td>
        <td>{{ inv.contactName }}</td>
        <td>{{ inv.dueDate ?? '—' }}</td>
        <td>{{ inv.totalAmount }}</td>
        <td>{{ inv.status }}</td>
      </tr>
    </tbody>
  </table>
</div>
