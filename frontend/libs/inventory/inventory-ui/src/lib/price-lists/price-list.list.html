<bb-register-header title="Price lists" [count]="rows().length" newLabel="New tier" [newDisabled]="busy()" (create)="startAdd()" />

<bb-status-tabs label="Price list status" [tabs]="statusTabs()" [value]="status()" (valueChange)="status.set($event)" />

@if (message()) {
  <bb-message-box [messages]="[{ tone: messageIsError() ? 'error' : 'success', text: message()! }]" />
}

<bb-info-tooltip text="Create multiple price tiers (e.g. Retail, Wholesale) and assign them to specific customers."></bb-info-tooltip>

<section class="register-card">
  <bb-data-grid register fillHeight flush stackOnPhone label="Price lists" [gridCode]="'PRICE_LISTS'" [columns]="columns" [data]="visibleRows()">
    <ng-template bbCellTemplate="name" let-row>
      <div [class.inactive]="!row.isActive">{{ row.name }}</div>
    </ng-template>
    <ng-template bbCellTemplate="description" let-row>
      {{ row.description }}
    </ng-template>
    <ng-template bbCellTemplate="active" let-row>
      {{ row.isActive ? 'Active' : 'Inactive' }}
    </ng-template>
    <ng-template bbCellTemplate="actions" let-row>
      <div class="row-actions">
        <bb-icon-button icon="edit" title="Edit tier" (actionClick)="startEdit(row)" [disabled]="busy()" />
      </div>
    </ng-template>
  </bb-data-grid>
</section>

@if (editingId() !== null) {
  <div class="sheet">
    <h2>{{ editingId() === 'new' ? 'New tier' : 'Edit tier' }}</h2>
    <div class="fields">
      <div class="field">
        <bb-text-input label="Tier Name" [(ngModel)]="form.name" maxlength="100" />
      </div>
      <div class="field">
        <bb-text-input label="Description" [(ngModel)]="form.description" maxlength="255" />
      </div>
      <bb-checkbox
        text="Active"
        [(ngModel)]="form.isActive"
      />
    </div>
    <div class="sheet-actions">
      <button class="btn btn-primary" type="button" (click)="save()" [disabled]="busy() || !form.name">
        Save
      </button>
      <button type="button" class="link" (click)="editingId.set(null)">Cancel</button>
    </div>
  </div>
}
