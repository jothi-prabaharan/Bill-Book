<bb-register-header title="Metal purities" [count]="rows().length" newLabel="New purity" [newDisabled]="busy()" (create)="startAdd()" />

<bb-status-tabs label="Purity status" [tabs]="statusTabs()" [value]="status()" (valueChange)="status.set($event)" />

@if (message()) {
  <bb-message-box [messages]="[{ tone: messageIsError() ? 'error' : 'success', text: message()! }]" />
}

<bb-info-tooltip text="The factor is the fraction of pure metal — 22K is 0.9160. It multiplies the pure-metal rate to price a piece, so it is fixed once an item uses it."></bb-info-tooltip>

<section class="register-card">
  <div class="register-toolbar">
    <bb-select
      ariaLabel="Filter by metal"
      placeholder="All metals"
      [options]="metalFilterOptions"
      [(ngModel)]="metalFilter"
      (ngModelChange)="load()"
    />
  </div>

  <bb-data-grid register fillHeight flush stackOnPhone label="Metal purities" [gridCode]="'METAL_PURITIES'" [columns]="columns" [data]="visibleRows()">
  
    <ng-template bbCellTemplate="metalType" let-row>
      <div [class.inactive]="!row.isActive">{{ row.metalType }}</div>
    </ng-template>
  
    <ng-template bbCellTemplate="purityName" let-row>
      <div [class.inactive]="!row.isActive">
        {{ row.purityName }}
        @if (row.isSystem) {
          <span class="badge">Built-in</span>
        }
      </div>
    </ng-template>
  
    <ng-template bbCellTemplate="purityFactor" let-row>
      <div class="num" [class.inactive]="!row.isActive">{{ row.purityFactor }}</div>
    </ng-template>
  
    <ng-template bbCellTemplate="isActive" let-row>
      <div [class.inactive]="!row.isActive">{{ row.isActive ? 'Active' : 'Inactive' }}</div>
    </ng-template>
  
    <ng-template bbCellTemplate="actions" let-row>
      <div class="row-actions" [class.inactive]="!row.isActive">
        <bb-icon-button icon="edit" title="Edit purity" (actionClick)="startEdit(row)" [disabled]="busy()" />
        @if (!row.isSystem) {
          <bb-icon-button icon="delete" tone="danger" title="Delete purity" (actionClick)="remove(row)" [disabled]="busy()" />
        }
      </div>
    </ng-template>
  </bb-data-grid>
</section>

@if (editingId() !== null) {
  <div class="sheet narrow">
    <h2>{{ editingId() === 0 ? 'New purity' : 'Edit purity' }}</h2>
    <div class="fields">
      <div class="field">
        <bb-select
          label="Metal"
          placeholder=""
          [options]="metalOptions"
          [disabled]="editingId() !== 0"
          [(ngModel)]="form.metalType"
        />
      </div>
      <div class="field">
        <bb-text-input label="Name" hint="What the counter calls it: 22K, 916, 999."  [(ngModel)]="form.purityName" maxlength="20" />
      </div>
      <div class="field">
        <bb-number-input label="Factor"  [(ngModel)]="form.purityFactor" step="0.0001" min="0.0001" max="1" />
      </div>
      <bb-checkbox
        text="Active"
        [(ngModel)]="form.isActive"
      />
    </div>
    <div class="sheet-actions">
      <button class="btn btn-primary" type="button" (click)="save()" [disabled]="busy() || !form.purityName">Save</button>
      <button type="button" class="link" (click)="editingId.set(null)">Cancel</button>
    </div>
  </div>
}
