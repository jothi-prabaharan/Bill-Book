<header class="page-head">
  <h1>Enquiries</h1>
  <button *bbIfCan="'admission.create'" type="button" class="btn btn-primary" (click)="startAdd()" [disabled]="busy()">+ New enquiry</button>
</header>

<div class="fields">
  <bb-select label="Status" placeholder="Every enquiry" [options]="statusOptions" [(ngModel)]="status" (ngModelChange)="load()" />
</div>

<bb-message-box [messages]="messages()" />

<bb-data-grid [gridCode]="'ADM_ENQUIRIES'" [columns]="columns" [data]="rows()">
  <ng-template bbCellTemplate="seekingClassId" let-row>{{ className(row.seekingClassId) }}</ng-template>
  <ng-template bbCellTemplate="followUpDate" let-row>{{ row.followUpDate ?? '—' }}</ng-template>
  <ng-template bbCellTemplate="actions" let-row>
    @if (row.enquiryStatus !== 'Converted') {
      <button *bbIfCan="'admission.edit'" type="button" class="link" (click)="startEdit(row)">Edit</button>
      <button *bbIfCan="'admission.create'" type="button" class="link" (click)="makeApplication(row)">Make application</button>
    }
  </ng-template>
</bb-data-grid>

@if (editingId() !== undefined) {
  <section class="sheet" aria-labelledby="enquiry-sheet-title">
    <h2 id="enquiry-sheet-title">{{ editingId() === null ? 'New enquiry' : 'Edit enquiry' }}</h2>
    <div class="fields">
      <bb-date-input label="Date" [(ngModel)]="form.enquiryDate" />
      <bb-text-input label="Child's name" [(ngModel)]="form.childName" maxlength="200" [required]="true" />
      <bb-date-input label="Date of birth" [(ngModel)]="form.dateOfBirth" />
      <bb-select label="School year" [options]="years()" [(ngModel)]="form.academicYearId" [clearable]="false" />
      <bb-select label="Class sought" [options]="classes()" [(ngModel)]="form.seekingClassId" [clearable]="false" />
      <bb-text-input label="Parent's name" [(ngModel)]="form.parentName" maxlength="200" [required]="true" />
      <bb-phone-input label="Phone" [(ngModel)]="form.phone" [required]="true" />
      <bb-email-input label="Email" [(ngModel)]="form.email" />
      <bb-select label="Source" [options]="sources" [(ngModel)]="form.enquirySource" [clearable]="false" />
      <bb-select label="Status" [options]="editableStatuses" [(ngModel)]="form.enquiryStatus" [clearable]="false" />
      <bb-date-input label="Follow up on" [(ngModel)]="form.followUpDate" />
    </div>
    <div class="sheet-actions">
      <button type="button" class="btn btn-ghost" (click)="cancel()">Cancel</button>
      <button type="button" class="btn btn-primary" (click)="save()" [disabled]="busy()">Save</button>
    </div>
  </section>
}
