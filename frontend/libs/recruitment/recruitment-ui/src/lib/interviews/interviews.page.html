<div class="page-head">
  <h1>Interviews</h1>
  <div style="display: flex; gap: 8px; align-items: center;">
    <bb-select label="Candidate Application" name="selectedAppId" [options]="selectedAppOptions()" [clearable]="false" [ngModel]="selectedAppId()" (ngModelChange)="selectApplication($event)" />
    <button type="button" class="btn btn-primary" (click)="openSchedule()" [disabled]="!selectedAppId()">Schedule Round</button>
  </div>
</div>

<bb-message-box *ngIf="errorMessage() as message" [messages]="[{ tone: 'error', text: message }]" />

<div *ngIf="showScheduleModal()" class="sheet" style="background: #f0fdf4; border-color: #bbf7d0;">
  <h3>Schedule Interview Round</h3>
  <div class="fields">
    <div>
      <bb-number-input label="Round Number" [min]="1" [max]="10" name="roundNo" [(ngModel)]="scheduleForm().roundNo" />
    </div>
    <div>
      <bb-select label="Round Type" name="roundKind" [options]="roundKindOptions" [clearable]="false" [(ngModel)]="scheduleForm().roundKind" />
    </div>
    <div>
      <bb-datetime-input label="Scheduled Time" name="scheduledAt" [(ngModel)]="scheduleForm().scheduledAt" />
    </div>
    <div>
      <bb-number-input label="Interviewer Employee ID" name="interviewerEmployeeId" [(ngModel)]="scheduleForm().interviewerEmployeeId" />
    </div>
  </div>
  <div class="sheet-actions">
    <button type="button" class="btn btn-secondary" (click)="showScheduleModal.set(false)">Cancel</button>
    <button type="button" class="btn btn-primary" (click)="schedule()">Confirm Schedule</button>
  </div>
</div>

<div *ngIf="showFeedbackModal()" class="sheet" style="background: #faf5ff; border-color: #e9d5ff;">
  <h3>Interview Feedback & Evaluation</h3>
  <div class="fields">
    <div>
      <bb-select label="Rating (1 to 5)" name="rating" [options]="ratingOptions" [clearable]="false" [(ngModel)]="feedbackForm().rating" />
    </div>
    <div>
      <bb-select label="Outcome" name="outcome" [options]="outcomeOptions" [clearable]="false" [(ngModel)]="feedbackForm().outcome" />
    </div>
    <div style="grid-column: 1 / -1;">
      <bb-textarea label="Evaluation Feedback" [rows]="3" placeholder="Candidate's technical ability, strengths, weaknesses..." name="feedback" [(ngModel)]="feedbackForm().feedback" />
    </div>
  </div>
  <div class="sheet-actions">
    <button type="button" class="btn btn-secondary" (click)="showFeedbackModal.set(false)">Cancel</button>
    <button type="button" class="btn btn-primary" (click)="saveFeedback()">Submit Feedback</button>
  </div>
</div>

<div class="table-container">
  <bb-data-grid
    [columns]="interviewsColumns"
    [data]="interviews()"
    flush
    emptyText="No interview rounds scheduled for this candidate application."
  >
    <ng-template bbCellTemplate="roundNo" let-r>
      <strong>Round {{ r.roundNo }}</strong>
    </ng-template>
    <ng-template bbCellTemplate="scheduledAt" let-r>
      {{ r.scheduledAt | date:'medium' }}
    </ng-template>
    <ng-template bbCellTemplate="rating" let-r>
      {{ r.rating ? (r.rating + ' / 5') : '—' }}
    </ng-template>
    <ng-template bbCellTemplate="outcome" let-r>
      <span class="badge" [ngClass]="r.outcome.toLowerCase()">
        {{ r.outcome }}
      </span>
    </ng-template>
    <ng-template bbCellTemplate="feedback" let-r>
      {{ r.feedback || '—' }}
    </ng-template>
    <ng-template bbCellTemplate="col6" let-r>
      <button type="button" class="btn btn-sm btn-secondary" (click)="openFeedback(r)">Evaluate</button>
    </ng-template>
  </bb-data-grid>
</div>
