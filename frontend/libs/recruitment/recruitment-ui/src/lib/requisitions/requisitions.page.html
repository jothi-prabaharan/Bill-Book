<div class="page-head">
  <h1>Job Requisitions</h1>
  <button type="button" class="btn btn-primary" (click)="openCreate()">New Requisition</button>
</div>

<bb-message-box *ngIf="errorMessage() as message" [messages]="[{ tone: 'error', text: message }]" />

<div *ngIf="showForm()" class="sheet">
  <h3>Create Job Requisition</h3>
  <div class="fields">
    <div>
      <bb-number-input label="Openings" [min]="1" [max]="100" name="openings" [(ngModel)]="form().openings" />
    </div>
    <div>
      <bb-select label="Employment Type" name="employmentType" [options]="employmentTypeOptions" [clearable]="false" [(ngModel)]="form().employmentType" />
    </div>
    <div>
      <bb-money-input label="Min CTC (₹)" name="minCtc" [(ngModel)]="form().minCtc" />
    </div>
    <div>
      <bb-money-input label="Max CTC (₹)" name="maxCtc" [(ngModel)]="form().maxCtc" />
    </div>
    <div style="grid-column: 1 / -1;">
      <bb-textarea label="Justification" [rows]="3" name="justification" [(ngModel)]="form().justification" />
    </div>
  </div>
  <div class="sheet-actions">
    <button type="button" class="btn btn-secondary" (click)="cancelForm()">Cancel</button>
    <button type="button" class="btn btn-primary" (click)="save()">Save Requisition</button>
  </div>
</div>

<div class="table-container">
  <bb-data-grid
    [columns]="requisitionsColumns"
    [data]="requisitions()"
    flush
    emptyText="No job requisitions found."
  >
    <ng-template bbCellTemplate="requisitionCode" let-req>
      <strong>{{ req.requisitionCode }}</strong>
    </ng-template>
    <ng-template bbCellTemplate="minCtc" let-req>
      ₹{{ req.minCtc | number }} – ₹{{ req.maxCtc | number }}
    </ng-template>
    <ng-template bbCellTemplate="approvalStatus" let-req>
      <span class="badge" [ngClass]="req.approvalStatus.toLowerCase()">
        {{ req.approvalStatus }}
      </span>
    </ng-template>
    <ng-template bbCellTemplate="currentStepLabel" let-req>
      {{ req.currentStepLabel || '—' }}
    </ng-template>
    <ng-template bbCellTemplate="col6" let-req>
      <div style="display: flex; gap: 6px;">
        <button *ngIf="req.approvalStatus === 'Draft'" type="button" class="btn btn-sm btn-secondary" (click)="submit(req.jobRequisitionId)">Submit</button>
        <button *ngIf="req.approvalStatus === 'PendingApproval'" type="button" class="btn btn-sm btn-secondary" (click)="approve(req.jobRequisitionId)">Approve</button>
        <button *ngIf="req.approvalStatus === 'PendingApproval'" type="button" class="btn btn-sm btn-danger-outline" (click)="reject(req.jobRequisitionId)">Reject</button>
      </div>
    </ng-template>
  </bb-data-grid>
</div>
