<div class="page-head">
  <h1>Job Openings</h1>
  <button type="button" class="btn btn-primary" (click)="openCreate()">New Job Opening</button>
</div>

<bb-message-box *ngIf="errorMessage() as message" [messages]="[{ tone: 'error', text: message }]" />

<div *ngIf="showForm()" class="sheet">
  <h3>Create Job Opening</h3>
  <div class="fields">
    <div>
      <bb-select label="Job Requisition" name="jobRequisitionId" [options]="jobRequisitionOptions()" [clearable]="false" [(ngModel)]="form().jobRequisitionId" />
    </div>
    <div>
      <bb-text-input label="Title" placeholder="e.g. Senior Frontend Engineer" name="title" [(ngModel)]="form().title" />
    </div>
    <div>
      <bb-select label="Status" name="openingStatus" [options]="openingStatusOptions" [clearable]="false" [(ngModel)]="form().openingStatus" />
    </div>
    <div style="grid-column: 1 / -1;">
      <bb-textarea label="Job Description" [rows]="4" placeholder="Requirements, responsibilities..." name="description" [(ngModel)]="form().description" />
    </div>
  </div>
  <div class="sheet-actions">
    <button type="button" class="btn btn-secondary" (click)="cancelForm()">Cancel</button>
    <button type="button" class="btn btn-primary" (click)="save()">Save Opening</button>
  </div>
</div>

<div class="table-container">
  <bb-data-grid
    [columns]="openingsColumns"
    [data]="openings()"
    flush
    emptyText="No job openings found."
  >
    <ng-template bbCellTemplate="title" let-op>
      <strong>{{ op.title }}</strong>
    </ng-template>
    <ng-template bbCellTemplate="openingStatus" let-op>
      <span class="badge" [ngClass]="op.openingStatus.toLowerCase()">
        {{ op.openingStatus }}
      </span>
    </ng-template>
    <ng-template bbCellTemplate="publishedDate" let-op>
      {{ op.publishedDate || '—' }}
    </ng-template>
    <ng-template bbCellTemplate="col5" let-op>
      <div style="display: flex; gap: 6px;">
        <button *ngIf="op.openingStatus === 'Draft'" type="button" class="btn btn-sm btn-outline-success" (click)="changeStatus(op.jobOpeningId, 'Open')">Publish</button>
        <button *ngIf="op.openingStatus === 'Open'" type="button" class="btn btn-sm btn-outline-warning" (click)="changeStatus(op.jobOpeningId, 'OnHold')">Hold</button>
        <button *ngIf="op.openingStatus === 'Open' || op.openingStatus === 'OnHold'" type="button" class="btn btn-sm btn-outline-danger" (click)="changeStatus(op.jobOpeningId, 'Closed')">Close</button>
      </div>
    </ng-template>
  </bb-data-grid>
</div>
