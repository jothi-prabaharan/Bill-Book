<div class="page-head">
  <h1>Candidates</h1>
  <div style="display: flex; gap: 8px;">
    <bb-text-input
          ariaLabel="Search candidates"
          name="searchTerm"
          placeholder="Search by name, email, phone..."
          style="min-width: 250px;"
          [(ngModel)]="searchTerm"
          (enter)="onSearch()"
        />
    <button type="button" class="btn btn-secondary" (click)="onSearch()">Search</button>
    <button type="button" class="btn btn-primary" (click)="openCreate()">New Candidate</button>
  </div>
</div>

<bb-message-box *ngIf="errorMessage() as message" [messages]="[{ tone: 'error', text: message }]" />

<div *ngIf="showForm()" class="sheet">
  <h3>Add Candidate</h3>
  <div class="fields">
    <div>
      <bb-text-input label="First Name" name="firstName" [(ngModel)]="form().firstName" />
    </div>
    <div>
      <bb-text-input label="Last Name" name="lastName" [(ngModel)]="form().lastName" />
    </div>
    <div>
      <bb-email-input label="Email" name="email" [(ngModel)]="form().email" />
    </div>
    <div>
      <bb-text-input label="Phone" name="phone" [(ngModel)]="form().phone" />
    </div>
    <div>
      <bb-text-input label="Current Employer" name="currentEmployer" [(ngModel)]="form().currentEmployer" />
    </div>
    <div>
      <bb-money-input label="Current CTC (₹)" name="currentCtc" [(ngModel)]="form().currentCtc" />
    </div>
    <div>
      <bb-money-input label="Expected CTC (₹)" name="expectedCtc" [(ngModel)]="form().expectedCtc" />
    </div>
    <div>
      <bb-number-input label="Notice Period (Days)" name="noticePeriodDays" [(ngModel)]="form().noticePeriodDays" />
    </div>
    <div>
      <bb-select label="Source" name="candidateSource" [options]="candidateSourceOptions" [clearable]="false" [(ngModel)]="form().candidateSource" />
    </div>
  </div>
  <div class="sheet-actions">
    <button type="button" class="btn btn-secondary" (click)="cancelForm()">Cancel</button>
    <button type="button" class="btn btn-primary" (click)="save()">Save Candidate</button>
  </div>
</div>

<div *ngIf="showApplyModal()" class="sheet" style="background: #eff6ff; border-color: #bfdbfe;">
  <h3>Apply Candidate to Job Opening</h3>
  <div class="fields">
    <div style="grid-column: 1 / -1;">
      <bb-select label="Select Active Opening" name="selectedOpeningId" [options]="selectedOpeningOptions()" [clearable]="false" [ngModel]="selectedOpeningId()" (ngModelChange)="selectedOpeningId.set($event)" />
    </div>
  </div>
  <div class="sheet-actions">
    <button type="button" class="btn btn-secondary" (click)="showApplyModal.set(false)">Cancel</button>
    <button type="button" class="btn btn-primary" (click)="applyToOpening()">Submit Application</button>
  </div>
</div>

<div class="table-container">
  <bb-data-grid fillHeight
    [columns]="candidatesColumns"
    [data]="candidates()"
    flush
    emptyText="No candidates found."
  >
    <ng-template bbCellTemplate="fullName" let-c>
      <strong>{{ c.fullName }}</strong>
    </ng-template>
    <ng-template bbCellTemplate="currentEmployer" let-c>
      {{ c.currentEmployer || '—' }}
    </ng-template>
    <ng-template bbCellTemplate="expectedCtc" let-c>
      {{ c.expectedCtc ? ('₹' + (c.expectedCtc | number)) : '—' }}
    </ng-template>
    <ng-template bbCellTemplate="noticePeriodDays" let-c>
      {{ c.noticePeriodDays ? (c.noticePeriodDays + ' days') : '—' }}
    </ng-template>
    <ng-template bbCellTemplate="candidateId" let-c>
      <button type="button" class="btn btn-sm btn-secondary" (click)="openApply(c.candidateId)">Apply</button>
    </ng-template>
  </bb-data-grid>
</div>
