<div class="page-head">
  <h1>Offers & Onboarding</h1>
  <button type="button" class="btn btn-primary" (click)="openCreate()">Generate Offer Letter</button>
</div>

<bb-message-box *ngIf="successMessage() as message" [messages]="[{ tone: 'success', text: message }]" />

<bb-message-box *ngIf="errorMessage() as message" [messages]="[{ tone: 'error', text: message }]" />

<div *ngIf="showForm()" class="sheet">
  <h3>Create Candidate Offer</h3>
  <div class="fields">
    <div>
      <bb-select label="Application" name="applicationId" [options]="applicationOptions()" [clearable]="false" [(ngModel)]="form().applicationId" />
    </div>
    <div>
      <bb-money-input label="Offered Annual CTC (₹)" name="offeredCtc" [(ngModel)]="form().offeredCtc" />
    </div>
    <div>
      <bb-money-input label="Salary Structure ID" name="salaryStructureId" [(ngModel)]="form().salaryStructureId" />
    </div>
    <div>
      <bb-branch-date-input label="Joining Date" name="joiningDate" [(ngModel)]="form().joiningDate" />
    </div>
  </div>
  <div class="sheet-actions">
    <button type="button" class="btn btn-secondary" (click)="cancelForm()">Cancel</button>
    <button type="button" class="btn btn-primary" (click)="save()">Save Draft Offer</button>
  </div>
</div>

<div class="table-container">
  <bb-data-grid
    [columns]="offersColumns"
    [data]="offers()"
    flush
    emptyText="No offers generated yet."
  >
    <ng-template bbCellTemplate="offerId" let-o>
      <strong>#{{ o.offerId }}</strong>
    </ng-template>
    <ng-template bbCellTemplate="offeredCtc" let-o>
      ₹{{ o.offeredCtc | number }}
    </ng-template>
    <ng-template bbCellTemplate="offerStatus" let-o>
      <span class="badge" [ngClass]="o.offerStatus.toLowerCase()">
        {{ o.offerStatus }}
      </span>
    </ng-template>
    <ng-template bbCellTemplate="createdEmployeeId" let-o>
      <span *ngIf="o.createdEmployeeId" style="color: #166534; font-weight: 600;">
        Employee #{{ o.createdEmployeeId }}
      </span>
      <span *ngIf="!o.createdEmployeeId" style="color: #64748b;">
        Not onboarded
      </span>
    </ng-template>
    <ng-template bbCellTemplate="col7" let-o>
      <div style="display: flex; gap: 6px;">
        <button *ngIf="o.offerStatus === 'Draft'" type="button" class="btn btn-sm btn-secondary" (click)="approve(o.offerId)">Approve</button>
        <button *ngIf="o.offerStatus === 'Approved'" type="button" class="btn btn-sm btn-secondary" (click)="send(o.offerId)">Send</button>
        <button *ngIf="o.offerStatus === 'Sent'" type="button" class="btn btn-sm btn-success btn-secondary" (click)="accept(o.offerId)">Accept & Onboard</button>
        <button *ngIf="o.offerStatus === 'Sent'" type="button" class="btn btn-sm btn-danger-outline" (click)="decline(o.offerId)">Decline</button>
        <button *ngIf="o.offerStatus !== 'Accepted' && o.offerStatus !== 'Declined' && o.offerStatus !== 'Revoked'" type="button" class="btn btn-sm btn-outline-secondary btn-secondary" (click)="revoke(o.offerId)">Revoke</button>
      </div>
    </ng-template>
  </bb-data-grid>
</div>
