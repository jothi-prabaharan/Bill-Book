<h1>Email settings</h1>
<p class="hint">
  Used to send invitations, verification codes and password resets.
</p>

@if (inherited()) {
  <p class="note">
    This organization currently sends using the platform mailbox. Saving here creates your own.
  </p>
}

@if (message()) {
  <p [class]="messageIsError() ? 'error' : 'ok'">{{ message() }}</p>
}

<form (ngSubmit)="save()">
  <div class="row">
    <label class="grow">
      SMTP host
      <bb-text-input name="host" [(ngModel)]="form.host" required placeholder="smtp.gmail.com" />
    </label>
    <label class="narrow">
      Port
      <bb-number-input name="port"  [(ngModel)]="form.port" required />
    </label>
  </div>

  <bb-checkbox text="Use SSL/TLS" name="useSsl" [(ngModel)]="form.useSsl" />

  <div class="row">
    <div class="field grow">
      <bb-email-input
        label="From address"
        name="fromEmail"
        [required]="true"
        [(ngModel)]="form.fromEmail"
      />
    </div>
    <label class="grow">
      From name
      <bb-text-input name="fromName" [(ngModel)]="form.fromName" required placeholder="Bill-Book" />
    </label>
  </div>

  <label>
    Username
    <bb-text-input name="username" [(ngModel)]="form.username" required />
  </label>

  <div class="field">
    <bb-password-input
      label="Password"
      name="password"
      purpose="new"
      [placeholder]="hasPassword() ? '•••••••• (unchanged)' : 'Required'"
      [hint]="passwordHint()"
      [required]="!hasPassword()"
      [(ngModel)]="form.password"
    />
  </div>

  <bb-checkbox text="Active" name="isActive" [(ngModel)]="form.isActive" />

  <div class="actions">
    <button type="submit" [disabled]="busy()">Save</button>
    <button type="button" class="secondary" (click)="sendTest()" [disabled]="busy() || inherited()">
      Send test email
    </button>
  </div>
</form>
