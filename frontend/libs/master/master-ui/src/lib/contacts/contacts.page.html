
<nav aria-label="Contact views" class="flex flex-wrap mb-3 gap-6px">
  <span class="tabgrp">
    <button class="btn btn-secondary" type="button" [attr.aria-pressed]="roleFilter === '' ? 'true' : null" (click)="roleFilter = ''; load()">All contacts</button>
  </span>
  <span class="tabgrp">
    <button class="btn btn-secondary" type="button" [attr.aria-pressed]="roleFilter === 'customer' ? 'true' : null" (click)="roleFilter = 'customer'; load()">Customers</button>
    <button class="btn btn-secondary" type="button" title="New customer" aria-label="New customer" (click)="openAdd('customer')" [disabled]="busy()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
    </button>
  </span>
  <span class="tabgrp">
    <button class="btn btn-secondary" type="button" [attr.aria-pressed]="roleFilter === 'vendor' ? 'true' : null" (click)="roleFilter = 'vendor'; load()">Vendors</button>
    <button class="btn btn-secondary" type="button" title="New vendor" aria-label="New vendor" (click)="openAdd('vendor')" [disabled]="busy()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
    </button>
  </span>
  <span class="tabgrp">
    <button class="btn btn-secondary" type="button" [attr.aria-pressed]="roleFilter === 'jobworker' ? 'true' : null" (click)="roleFilter = 'jobworker'; load()">Job workers</button>
  </span>
  <span class="tabgrp">
    <button class="btn btn-secondary" type="button" [attr.aria-pressed]="roleFilter === 'prescriber' ? 'true' : null" (click)="roleFilter = 'prescriber'; load()">Prescribers</button>
  </span>
  @if (isSchool()) {
    <span class="tabgrp">
      <button class="btn btn-secondary" type="button" [attr.aria-pressed]="roleFilter === 'guardian' ? 'true' : null" (click)="roleFilter = 'guardian'; load()">Guardians</button>
    </span>
  }
</nav>

<div class="actbar">
  <bb-search-input  [(ngModel)]="search" (keyup.enter)="load()" placeholder="Name, code or GSTIN" aria-label="Search contacts" class="w-auto flex-1 input text-sm actbar-search"/>

  <bb-select
    ariaLabel="Filter by status"
    class="w-auto text-sm actbar-select"
    placeholder=""
    [options]="statusFilterOptions"
    [(ngModel)]="statusFilter"
    (ngModelChange)="load()"
  />

  
  
  <bb-export-import />
</div>


@if (message(); as failure) {
  <bb-message-box [messages]="[{ tone: 'error', text: failure }]" />
}

<div class="card bg-surface">
  <bb-data-grid fillHeight flush [gridCode]="'CONTACTS'" [columns]="gridColumns()" [data]="gridRows()" (rowClick)="openEdit($event)">
    <ng-template bbCellTemplate="contactCode" let-row>
      {{ row.contactCode }}
    </ng-template>
    <ng-template bbCellTemplate="nameGstin" let-row>
      {{ row.displayName }} &middot; <span class="muted">{{ row.gstin || 'Unregistered' }}</span>
      @if (row.isDraft) {
        <span class="tag tag-warning" title="Saved to finish later. No document can pick it until it is saved.">Draft</span>
      }
      @if (!row.isSubLedgerLinked && !row.isDraft) {
        <span class="badge unlinked" title="Cannot be invoiced or billed until linked">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
        </span>
      }
    </ng-template>
    <ng-template bbCellTemplate="city" let-row>
      {{ row.city || '—' }}
    </ng-template>
    <ng-template bbCellTemplate="role" let-row>
      <span class="tag tag-neutral">{{ roleLabels(row) }}</span>
    </ng-template>
    <ng-template bbCellTemplate="outstanding" let-row>
      <div class="tabular-nums text-right">—</div>
    </ng-template>
    <ng-template bbCellTemplate="creditLimit" let-row>
      <div class="tabular-nums text-right">—</div>
    </ng-template>
  </bb-data-grid>
</div>
