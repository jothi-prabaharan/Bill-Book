<div class="shell-grid-container">
  <div class="shell-nav-cell">
    <bb-shell-nav (logout)="logout()" />
  </div>

  <div class="shell-topbar-cell">
    <bb-shell-topbar (logout)="logout()" />
  </div>

  <div class="shell-subpanel-cell">
    <bb-shell-subpanel />
  </div>

  <div class="shell-breadcrumb-cell">
    <bb-shell-breadcrumb
      [crumbsInput]="crumbs()"
      [base]="base()"
      [baseLabel]="baseLabel()"
      [editing]="editing()"
      [starred]="currentIsStarred()"
      [starrable]="currentIsStarrable()"
      (toggleStar)="toggleStar()"
      (toggleBase)="toggleBase()"
      (startEdit)="startEdit()"
      (resetLayout)="resetLayout()"
      (stopEdit)="stopEdit()"
      (openExport)="openExport($event)"
      (openImport)="openImport()"
    />
  </div>

  <main class="shell-content-cell">
    <router-outlet />
  </main>
</div>
