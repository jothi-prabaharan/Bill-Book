<nav aria-label="Breadcrumb" class="crumbs">
  <button
    class="iconbtn crumb-panel-toggle"
    type="button"
    (click)="togglePanel()"
    [disabled]="!hasPanel()"
    [attr.aria-pressed]="panelShown()"
    [attr.aria-label]="panelToggleLabel()"
    [title]="panelToggleLabel()"
  >
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
  </button>

  <a routerLink="/dashboard" (click)="onCrumbClicked({ label: 'Home', path: '/dashboard', isLink: true, isLast: false })">Home</a>

  @for (crumb of effectiveCrumbs(); track crumb.label) {
    <span class="sep" aria-hidden="true">›</span>
    @if (crumb.isLink) {
      <a [routerLink]="crumb.path" (click)="onCrumbClicked(crumb)">{{ crumb.label }}</a>
    }
    @if (crumb.isLast) {
      <span aria-current="page">{{ crumb.label }}</span>
    }
  }

  @if (starrable()) {
    <button
      class="iconbtn crumb-star"
      type="button"
      (click)="onToggleStar()"
      [attr.aria-pressed]="starred()"
      [attr.aria-label]="starred() ? 'Remove this screen from favourites' : 'Add this screen to favourites'"
      [title]="starred() ? 'Remove from favourites' : 'Add to favourites'"
    >
      @if (starred()) {
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.6l2.9 5.88 6.5.94-4.7 4.58 1.11 6.47L12 17.42l-5.81 3.05 1.11-6.47-4.7-4.58 6.5-.94z"/></svg>
      } @else {
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.6l2.9 5.88 6.5.94-4.7 4.58 1.11 6.47L12 17.42l-5.81 3.05 1.11-6.47-4.7-4.58 6.5-.94z"/></svg>
      }
    </button>
  }

  <div class="acts">
    <!-- Controls projected by the screen itself -->
    <ng-content select="[bbShellActions], .acts" />

    @if (isHome()) {
      @if (notEditing()) {
        @if (auth.has('platform.view')) {
          <a class="btn btn-ghost" routerLink="/admin">Admin portal</a>
        }
        <button class="btn btn-secondary" type="button" (click)="onStartEdit()">Customize</button>
      } @else {
        <button class="btn btn-ghost" type="button" (click)="onResetLayout()">Reset</button>
        <button class="btn btn-secondary" type="button" (click)="onStopEdit()">Done</button>
      }
    }
  </div>
</nav>
