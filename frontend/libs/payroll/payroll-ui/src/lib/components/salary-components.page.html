<div class="page-head">
  <h1>Salary Components</h1>
  <button type="button" class="btn btn-primary" (click)="startAdd()">+ New Component</button>
</div>

<bb-message-box [messages]="messages()" />

<div class="table-container">
  <bb-data-grid
    [columns]="rowsColumns"
    [data]="rows()"
    flush
    emptyText="No salary components created yet."
  >
    <ng-template bbCellTemplate="name" let-row>
      <strong>{{ row.name }}</strong>
    </ng-template>
    <ng-template bbCellTemplate="isTaxable" let-row>
      {{ row.isTaxable ? 'Yes' : 'No' }}
    </ng-template>
    <ng-template bbCellTemplate="formula" let-row>
      {{ row.formula || '-' }}
    </ng-template>
    <ng-template bbCellTemplate="salaryComponentId" let-row>
      <button type="button" class="btn btn-link" (click)="startEdit(row)">Edit</button>
      <button type="button" class="btn btn-link text-danger" (click)="deleteRow(row.salaryComponentId)">Delete</button>
    </ng-template>
  </bb-data-grid>
</div>

@if (editingId() !== undefined) {
  <div class="sheet">
    <h3>{{ editingId() === null ? 'New Salary Component' : 'Edit Salary Component' }}</h3>
    <div class="fields">
      <bb-text-input label="Name" [(ngModel)]="form.name" required />
      <bb-select label="Kind" [options]="kinds" [(ngModel)]="form.kind" />
      <bb-select label="Value Type" [options]="valueTypes" [(ngModel)]="form.valueType" />
      <bb-checkbox label="Is Taxable" [(ngModel)]="form.isTaxable" />
      @if (form.valueType === 'Formula') {
        <bb-text-input label="Formula (e.g. 0.5 * BASIC)" [(ngModel)]="form.formula" />
      }
    </div>
    <div class="sheet-actions">
      <button type="button" class="btn btn-secondary" (click)="editingId.set(undefined)">Cancel</button>
      <button type="button" class="btn btn-primary" [disabled]="busy()" (click)="save()">Save</button>
    </div>
  </div>
}
