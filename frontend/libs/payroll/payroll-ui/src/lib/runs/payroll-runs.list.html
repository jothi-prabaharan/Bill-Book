<div class="page-head">
  <h1>Payroll Runs</h1>
  <div style="display: flex; gap: 8px; align-items: center;">
    <bb-month-input ariaLabel="Payroll month" name="selectedMonth" [(ngModel)]="selectedMonth" />
    <button type="button" class="btn btn-primary" [disabled]="busy()" (click)="processRun()">Process Pay Run</button>
  </div>
</div>

<bb-message-box [messages]="messages()" />

<div class="table-container">
  <bb-data-grid
    [columns]="runsColumns"
    [data]="runs()"
    flush
    emptyText="No payroll runs processed yet."
  >
    <ng-template bbCellTemplate="month" let-run>
      <strong>{{ run.month | slice:0:7 }}</strong>
    </ng-template>
    <ng-template bbCellTemplate="status" let-run>
      <span class="badge status-{{ run.status.toLowerCase() }}">{{ run.status }}</span>
    </ng-template>
    <ng-template bbCellTemplate="totalGrossEarnings" let-run>
      ₹{{ run.totalGrossEarnings | number:'1.2-2' }}
    </ng-template>
    <ng-template bbCellTemplate="totalGrossDeductions" let-run>
      ₹{{ run.totalGrossDeductions | number:'1.2-2' }}
    </ng-template>
    <ng-template bbCellTemplate="totalNetPay" let-run>
      <strong>₹{{ run.totalNetPay | number:'1.2-2' }}</strong>
    </ng-template>
    <ng-template bbCellTemplate="payrollRunId" let-run>
      <a [routerLink]="['/payroll/runs', run.payrollRunId]" class="btn btn-link">View Details</a>
    </ng-template>
  </bb-data-grid>
</div>
