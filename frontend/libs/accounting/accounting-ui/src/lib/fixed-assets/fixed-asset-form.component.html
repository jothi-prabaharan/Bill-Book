<button type="button" class="sheet-backdrop" (click)="close()" aria-label="Close"></button>

<section class="sheet" role="dialog" aria-modal="true" aria-labelledby="capitalize-asset-title">
  <header class="sheet-head">
    <h2 id="capitalize-asset-title">Capitalize asset</h2>
    <button type="button" class="close" (click)="close()" aria-label="Close">×</button>
  </header>

  @if (error(); as message) {
    <p class="error">{{ message }}</p>
  }

  <form (ngSubmit)="save()">
    <div class="field">
      <bb-number-input label="Category" hint="The category carries the accounts this asset posts to." [(ngModel)]="model.fixedAssetCategoryId" name="fixedAssetCategoryId" required />
    </div>

    <div class="field">
      <bb-text-input label="Asset code" [(ngModel)]="model.assetCode" name="assetCode" maxlength="30" required />
    </div>

    <div class="field">
      <bb-text-input label="Asset name" [(ngModel)]="model.assetName" name="assetName" maxlength="100" required />
    </div>

    <div class="field">
      <bb-number-input label="Purchase bill" hint="Optional — leave empty for an asset that came across on migration." [(ngModel)]="model.purchaseBillId" name="purchaseBillId" />
    </div>

    <div class="field">
      <!-- An amount in decimal rupees, which is what the API takes, so the
           default `minorDigits` of zero is right. -->
      <bb-money-input label="Cost" [(ngModel)]="model.purchasePrice" name="purchasePrice" [required]="true" />
    </div>

    <div class="field">
      <bb-date-input label="Purchase date" [(ngModel)]="model.purchaseDate" name="purchaseDate" required />
    </div>

    <div class="sheet-actions">
      <button type="button" (click)="close()" [disabled]="saving()">Cancel</button>
      <button type="submit" [disabled]="saving()">
        {{ saving() ? 'Capitalizing…' : 'Capitalize' }}
      </button>
    </div>
  </form>
</section>
