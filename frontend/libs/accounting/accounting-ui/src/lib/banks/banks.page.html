<bb-register-header title="Banks" [count]="rows().length" newLabel="New bank" [newDisabled]="busy()" (create)="startAdd()" />

<bb-status-tabs label="Bank status" [tabs]="statusTabs()" [value]="status()" (valueChange)="status.set($event)" />

@if (message()) {
  <bb-message-box [messages]="[{ tone: messageIsError() ? 'error' : 'success', text: message()! }]" />
}

<section class="register-card">
  <bb-data-grid register fillHeight flush stackOnPhone label="Banks" [gridCode]="'BANKS'" [columns]="columns" [data]="visibleRows()">
    <ng-template bbCellTemplate="code" let-row>
      <code>{{ row.bankCode }}</code>
    </ng-template>
    <ng-template bbCellTemplate="bank" let-row>
      {{ row.bankName }}
    </ng-template>
    <ng-template bbCellTemplate="accounts" let-row>
      {{ row.accountCount }}
    </ng-template>
    <ng-template bbCellTemplate="active" let-row>
      <span class="tag" [class.tag-success]="row.isActive" [class.tag-neutral]="!row.isActive">{{ row.isActive ? 'Active' : 'Inactive' }}</span>
    </ng-template>
    <ng-template bbCellTemplate="actions" let-row>
      <button type="button" class="link" (click)="startEdit(row)" [disabled]="busy()">Edit</button>
      @if (row.accountCount === 0) {
        <button type="button" class="link danger" (click)="remove(row)" [disabled]="busy()">Delete</button>
      }
    </ng-template>
  </bb-data-grid>
</section>

@if (editingId() !== null) {
  <div class="sheet narrow">
    <h2>{{ editingId() === 0 ? 'New bank' : 'Edit bank' }}</h2>
    <div class="fields">
      <div class="field">
        <bb-text-input label="Name"  [(ngModel)]="form.bankName" maxlength="100" />
      </div>
      <div class="field">
        <bb-text-input label="Code" hint="Blank takes the next code from the numbering series."  [(ngModel)]="form.bankCode" maxlength="20" [disabled]="editingId() !== 0" />
      </div>
      <bb-checkbox
        text="Active"
        [(ngModel)]="form.isActive"
      />
    </div>
    <div class="sheet-actions">
      <button class="btn btn-primary" type="button" (click)="save()" [disabled]="busy() || !form.bankName">Save</button>
      <button type="button" class="link" (click)="editingId.set(null)">Cancel</button>
    </div>
  </div>
}
