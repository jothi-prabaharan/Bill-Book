<div class="overlay">
  <div class="modal-content bb-card">
    <h3>New Ticket</h3>

    @if (errorMessage(); as failure) {
      <bb-message-box [messages]="[{ tone: 'error', text: failure }]" />
    }

    <!--
      Common inputs, so the label is tied to its control rather than floating
      beside it — the three loose `<label>` elements this replaced named nothing,
      which is what a screen reader would have reported.
    -->
    <form [formGroup]="form" (ngSubmit)="save()">
      <div class="form-group">
        <bb-text-input
          label="Subject"
          maxlength="200"
          formControlName="subject"
          [required]="true"
          [error]="showError('subject') ? 'Subject is required' : ''"
        />
      </div>

      <div class="form-group">
        <!-- A ticket's description runs to paragraphs, so a textarea rather
             than the single line it used to be. -->
        <bb-textarea
          label="Description"
          rows="4"
          formControlName="description"
          [required]="true"
          [error]="showError('description') ? 'Description is required' : ''"
        />
      </div>

      <div class="form-group">
        <bb-select
          label="Priority"
          placeholder=""
          [options]="priorityOptions"
          formControlName="priority"
          [required]="true"
        />
      </div>

      <div class="form-group">
        <bb-form-field
          label="Contact"
          controlId="ticketContact"
          [required]="true"
          [error]="showError('contactId') ? 'Contact is required' : ''"
        >
          <button id="ticketContact" type="button" class="input picker" (click)="openContactPicker()">
            {{ contactLabel() || 'Choose a contact' }}
          </button>
        </bb-form-field>
      </div>

      <div class="actions">
        <button type="button" class="bb-btn bb-btn-secondary" (click)="cancelled.emit()" [disabled]="saving()">Cancel</button>
        <button type="submit" class="bb-btn bb-btn-primary" [disabled]="form.invalid || saving()">
          {{ saving() ? 'Saving...' : 'Save' }}
        </button>
      </div>
    </form>
  </div>
</div>

<!--
  Its own layer above the ticket's overlay: the dialog stacks at 100 and the
  overlay at 1000, so without this the picker would open behind the form.
-->
@if (pickerOpen()) {
  <div class="picker-layer">
    <bb-lookup-dialog
      [open]="true"
      title="Choose a contact"
      placeholder="Search contacts by code, name or GSTIN"
      emptyText="No contacts match."
      [rows]="pickerRows()"
      [loading]="pickerLoading()"
      (searchChange)="searchContacts($event)"
      (choose)="chooseContact($event)"
      (dismiss)="closePicker()"
    />
  </div>
}
