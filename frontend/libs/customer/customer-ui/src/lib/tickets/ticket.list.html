<div class="tickets-container">
  <div class="header-actions">
    <h2>Tickets</h2>
    <button class="bb-btn bb-btn-primary" (click)="showForm.set(true)">New Ticket</button>
  </div>
  
  <bb-message-box *ngIf="errorMessage()" [messages]="[{ tone: 'error', text: errorMessage()! }]"></bb-message-box>
  
  <div *ngIf="loading()" class="loading-state">
    <p>Loading tickets...</p>
  </div>
  
  <div *ngIf="!loading() && tickets().length === 0" class="empty-state">
    <p>No tickets found.</p>
  </div>

  <bb-data-grid
    *ngIf="!loading() && tickets().length > 0"
    [data]="tickets()"
    [columns]="columns"
    gridCode="tickets-list"
    [pageSize]="25"
    [totalCount]="tickets().length"
  >
    <ng-template bbCellTemplate="actions" let-row="row">
      <button class="bb-btn bb-btn-secondary bb-btn-sm" (click)="viewThread(row)">View Thread</button>
    </ng-template>
  </bb-data-grid>
</div>

<bb-ticket-form 
  *ngIf="showForm()" 
  (saved)="onSaved()" 
  (cancelled)="showForm.set(false)">
</bb-ticket-form>

<bb-ticket-thread
  *ngIf="selectedTicket()"
  [ticket]="selectedTicket()!"
  (closed)="selectedTicket.set(null)"
></bb-ticket-thread>
