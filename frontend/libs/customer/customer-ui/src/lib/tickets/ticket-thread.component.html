<div class="bb-card thread-container">
  <div class="ticket-header">
    <h3>{{ ticket.subject }}</h3>
    <div class="ticket-meta">
      <span class="badge status-{{ ticket.status | lowercase }}">{{ ticket.status }}</span>
      <span class="badge priority-{{ ticket.priority | lowercase }}">{{ ticket.priority }}</span>
    </div>
  </div>
  <p class="ticket-desc">{{ ticket.description }}</p>

  <hr>

  <div class="messages">
    <div *ngIf="loading()" class="loading">Loading messages...</div>
    
    <div class="message bb-card" *ngFor="let msg of messages()" [class.from-contact]="msg.authorType === 'Contact'">
      <div class="msg-header">
        <strong>{{ msg.authorType }}</strong>
        <span class="date">{{ msg.createdAt | date:'short' }}</span>
      </div>
      <div class="msg-body">{{ msg.body }}</div>
    </div>

    <div *ngIf="!loading() && messages().length === 0" class="empty-state">
      No messages yet.
    </div>
  </div>

  <div class="reply-box">
    <textarea [(ngModel)]="newMessage" class="bb-input" rows="3" placeholder="Type your reply..."></textarea>
    <button class="bb-btn bb-btn-primary" [disabled]="sending() || !newMessage().trim()" (click)="sendMessage()">
      {{ sending() ? 'Sending...' : 'Send Reply' }}
    </button>
  </div>
</div>
