<div class="thread-overlay">
  <div class="thread-content bb-card">
    <div class="header">
      <h3>{{ _ticket()?.subject }} <span class="badge">{{ _ticket()?.status }}</span></h3>
      <button class="bb-btn bb-btn-icon" (click)="closed.emit()">&times;</button>
    </div>
    
    <bb-message-box *ngIf="errorMessage()" [messages]="[{ tone: 'error', text: errorMessage()! }]"></bb-message-box>
    
    <div *ngIf="loading()" class="loading-state">
      <p>Loading thread...</p>
    </div>

    <div class="messages" *ngIf="!loading()">
      <div *ngFor="let msg of messages()" class="message" [class.staff]="msg.authorType === 'User'">
        <div class="meta">
          <strong>{{ msg.authorType }}</strong> - {{ msg.createdAt | date:'short' }}
        </div>
        <div class="body">{{ msg.body }}</div>
      </div>
      <div *ngIf="messages().length === 0" class="empty-state">
        <p>No messages yet.</p>
      </div>
    </div>

    <div class="reply-box">
      <textarea 
        [disabled]="sending()"
        [ngModel]="replyBody()" 
        (ngModelChange)="replyBody.set($event)"
        class="bb-input" 
        rows="3" 
        placeholder="Type a reply..."></textarea>
      <button class="bb-btn bb-btn-primary" [disabled]="!replyBody().trim() || sending()" (click)="sendMessage()">
        {{ sending() ? 'Sending...' : 'Reply' }}
      </button>
    </div>
  </div>
</div>
