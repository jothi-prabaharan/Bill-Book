<div class="overlay">
  <div class="modal-content bb-card">
    <h3>New Lead</h3>

    @if (errorMessage(); as failure) {
      <bb-message-box [messages]="[{ tone: 'error', text: failure }]" />
    }

    <!--
      Common inputs throughout: the label, the error and the accessibility
      wiring belong to the control now, so this form reads the same as every
      other one in the product. The validation rules are unchanged — the email
      validator is the shared one, which is the same expression the field
      renders as its `pattern`.
    -->
    <form [formGroup]="form" (ngSubmit)="save()">
      <div class="form-group">
        <bb-text-input
          label="Name"
          formControlName="name"
          [required]="true"
          [error]="showError('name') ? 'Name is required' : ''"
        />
      </div>

      <div class="form-group">
        <bb-text-input label="Company Name" formControlName="companyName" />
      </div>

      <div class="form-group">
        <bb-email-input
          label="Email"
          formControlName="email"
          [error]="showError('email') ? 'Valid email is required' : ''"
        />
      </div>

      <div class="form-group">
        <bb-phone-input label="Phone" formControlName="phone" />
      </div>

      <div class="form-group">
        <bb-select
          label="Source"
          placeholder=""
          [options]="sourceOptions"
          formControlName="source"
          [required]="true"
        />
      </div>

      <div class="actions">
        <button type="button" class="bb-btn bb-btn-secondary" (click)="cancelled.emit()" [disabled]="saving()">Cancel</button>
        <button type="submit" class="bb-btn bb-btn-primary" [disabled]="form.invalid || saving()">
          {{ saving() ? 'Saving...' : 'Save' }}
        </button>
      </div>
    </form>
  </div>
</div>
