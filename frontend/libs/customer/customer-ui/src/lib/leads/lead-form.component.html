<div class="overlay">
  <div class="modal-content bb-card">
    <h3>New Lead</h3>
    
    <form [formGroup]="form" (ngSubmit)="save()">
      <div class="form-group">
        <label>
          Name
          <input type="text" formControlName="name" class="bb-input">
        </label>
      </div>

      <div class="form-group">
        <label>
          Company Name
          <input type="text" formControlName="companyName" class="bb-input">
        </label>
      </div>

      <div class="form-group">
        <label>
          Email
          <input type="email" formControlName="email" class="bb-input">
        </label>
      </div>

      <div class="form-group">
        <label>
          Phone
          <input type="tel" formControlName="phone" class="bb-input">
        </label>
      </div>

      <div class="form-group">
        <label>
          Source
          <select formControlName="source" class="bb-input">
            <option *ngFor="let s of sources" [value]="s">{{ s }}</option>
          </select>
        </label>
      </div>

      <div class="actions">
        <button type="button" class="bb-btn bb-btn-secondary" (click)="cancelled.emit()" [disabled]="saving()">Cancel</button>
        <button type="submit" class="bb-btn bb-btn-primary" [disabled]="form.invalid || saving()">Save</button>
      </div>
    </form>
  </div>
</div>
