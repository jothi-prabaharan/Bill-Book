<div class="page-head">
  <h1>Goals & Objectives</h1>
  <div>
    <button class="btn btn-primary" (click)="openCreate()">Add Goal</button>
  </div>
</div>

<div style="display: flex; gap: 1rem; align-items: center; margin-bottom: 1rem;">
  <div>
    <div>
      <bb-select label="Cycle" name="selectedCycleId" [options]="selectedCycleOptions()" [clearable]="false" [(ngModel)]="selectedCycleId" (ngModelChange)="loadGoals()" />
    </div>
  </div>
  <div>
    <div>
      <bb-number-input label="Employee ID" name="employeeId" [(ngModel)]="employeeId" (ngModelChange)="loadGoals()" />
    </div>
  </div>
  <div style="margin-left: auto; font-weight: 600;">
    Total Weightage: <span [style.color]="totalWeightage() === 100 ? '#16a34a' : '#d97706'">{{ totalWeightage() }}% / 100%</span>
  </div>
</div>

<bb-message-box *ngIf="errorMessage() as message" [messages]="[{ tone: 'error', text: message }]" />

<div *ngIf="showForm()" class="sheet">
  <h2>New Performance Goal</h2>
  <div class="fields">
    <div style="grid-column: 1 / -1;">
      <bb-text-input label="Title" placeholder="Key objective or deliverable" name="title" [(ngModel)]="form().title" />
    </div>
    <div style="grid-column: 1 / -1;">
      <bb-textarea label="Description" [rows]="3" name="description" [(ngModel)]="form().description" />
    </div>
    <div>
      <bb-percentage-input label="Weightage (%)" name="weightage" [(ngModel)]="form().weightage" />
    </div>
    <div>
      <bb-text-input label="Measure / Metric" placeholder="e.g. 99.9% uptime" name="measure" [(ngModel)]="form().measure" />
    </div>
    <div>
      <bb-text-input label="Target" placeholder="Target date or value" name="target" [(ngModel)]="form().target" />
    </div>
  </div>
  <div class="sheet-actions">
    <button class="btn btn-secondary" (click)="showForm.set(false)">Cancel</button>
    <button class="btn btn-primary" (click)="saveGoal()">Save Goal</button>
  </div>
</div>

<div class="table-container">
  <bb-data-grid
    [columns]="goalsColumns"
    [data]="goals()"
    flush
    emptyText="No goals defined for this employee in this cycle."
  >
    <ng-template bbCellTemplate="title" let-g>
      <strong>{{ g.title }}</strong>
    </ng-template>
    <ng-template bbCellTemplate="description" let-g>
      {{ g.description || '—' }}
    </ng-template>
    <ng-template bbCellTemplate="weightage" let-g>
      {{ g.weightage }}%
    </ng-template>
    <ng-template bbCellTemplate="measure" let-g>
      {{ g.measure || '—' }}
    </ng-template>
    <ng-template bbCellTemplate="target" let-g>
      {{ g.target || '—' }}
    </ng-template>
    <ng-template bbCellTemplate="goalStatus" let-g>
      <span class="badge" [ngClass]="'badge-' + g.goalStatus.toLowerCase()">{{ g.goalStatus }}</span>
    </ng-template>
  </bb-data-grid>
</div>
