<div class="page-head">
  <h1>Performance Review Cycles</h1>
  <div>
    <button class="btn btn-primary" (click)="openCreate()">New Review Cycle</button>
  </div>
</div>

<bb-message-box *ngIf="errorMessage() as message" [messages]="[{ tone: 'error', text: message }]" />

<!-- Create Cycle Modal/Sheet -->
<div *ngIf="showForm()" class="sheet">
  <h2>New Review Cycle</h2>
  <div class="fields">
    <div>
      <bb-text-input label="Cycle Name" placeholder="e.g. FY 2026-27 Annual Review" name="name" [(ngModel)]="form().name" />
    </div>
    <div>
      <bb-branch-date-input label="Period From" name="periodFrom" [(ngModel)]="form().periodFrom" />
    </div>
    <div>
      <bb-branch-date-input label="Period To" name="periodTo" [(ngModel)]="form().periodTo" />
    </div>
    <div>
      <bb-select label="Rating Scale" name="ratingScaleId" [options]="ratingScaleOptions()" [clearable]="false" [(ngModel)]="form().ratingScaleId" />
    </div>
    <div>
      <bb-percentage-input label="Goal Weight (%)" name="goalWeightPercent" [(ngModel)]="form().goalWeightPercent" />
    </div>
    <div>
      <bb-percentage-input label="Competency Weight (%)" name="competencyWeightPercent" [(ngModel)]="form().competencyWeightPercent" />
    </div>
    <div>
      <bb-branch-date-input label="Self Evaluation Due Date" name="selfEvaluationDueDate" [(ngModel)]="form().selfEvaluationDueDate" />
    </div>
    <div>
      <bb-branch-date-input label="Review Due Date" name="reviewDueDate" [(ngModel)]="form().reviewDueDate" />
    </div>
  </div>
  <div class="sheet-actions">
    <button class="btn btn-secondary" (click)="cancelCreate()">Cancel</button>
    <button class="btn btn-primary" (click)="saveCycle()">Create Cycle</button>
  </div>
</div>

<!-- Enroll Sheet -->
<div *ngIf="showEnroll()" class="sheet">
  <h2>Enroll Employees into Cycle</h2>
  <div class="fields">
    <div>
      <bb-branch-date-input label="Joined Before Date" name="joinedBeforeDate" [(ngModel)]="enrollForm().joinedBeforeDate" />
    </div>
  </div>
  <div class="sheet-actions">
    <button class="btn btn-secondary" (click)="showEnroll.set(false)">Cancel</button>
    <button class="btn btn-primary" (click)="enroll()">Enroll Eligible</button>
  </div>
</div>

<!-- Table of Cycles -->
<div class="table-container">
  <bb-data-grid fillHeight
    [columns]="cyclesColumns"
    [data]="cycles()"
    flush
    emptyText="No review cycles found. Click 'New Review Cycle' to create one."
  >
    <ng-template bbCellTemplate="name" let-c>
      <strong>{{ c.name }}</strong>
    </ng-template>
    <ng-template bbCellTemplate="periodFrom" let-c>
      {{ c.periodFrom }} to {{ c.periodTo }}
    </ng-template>
    <ng-template bbCellTemplate="cycleStatus" let-c>
      <span class="badge" [ngClass]="'badge-' + c.cycleStatus.toLowerCase()">{{ c.cycleStatus }}</span>
    </ng-template>
    <ng-template bbCellTemplate="goalWeightPercent" let-c>
      {{ c.goalWeightPercent }}% / {{ c.competencyWeightPercent }}%
    </ng-template>
    <ng-template bbCellTemplate="col6" let-c>
      <div style="display: flex; gap: 6px;">
        <button class="btn btn-sm btn-secondary" *ngIf="c.cycleStatus === 'Draft'" (click)="setStatus(c.reviewCycleId, 'GoalSetting')">Open Goals</button>
        <button class="btn btn-sm btn-secondary" *ngIf="c.cycleStatus === 'GoalSetting'" (click)="setStatus(c.reviewCycleId, 'SelfEvaluation')">Open Self-Eval</button>
        <button class="btn btn-sm btn-secondary" *ngIf="c.cycleStatus === 'SelfEvaluation'" (click)="setStatus(c.reviewCycleId, 'InReview')">Start Reviews</button>
        <button class="btn btn-sm btn-outline btn-secondary" (click)="openEnroll(c.reviewCycleId)">Enroll</button>
        <button class="btn btn-sm btn-danger" *ngIf="c.cycleStatus !== 'Closed'" (click)="closeCycle(c.reviewCycleId)">Close Cycle</button>
      </div>
    </ng-template>
  </bb-data-grid>
</div>
