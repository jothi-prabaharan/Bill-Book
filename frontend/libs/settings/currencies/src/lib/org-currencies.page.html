<header class="page-head">
  <h1>Currencies</h1>
  <div class="head-actions">
    <bb-checkbox
      text="Show inactive"
      [(ngModel)]="showInactive"
      (ngModelChange)="load()"
    />
    <button class="btn btn-primary" type="button" (click)="openAdd()" [disabled]="busy()">+ Add currency</button>
  </div>
</header>

@if (adding()) {
  <div class="backdrop" aria-hidden="true" (click)="closeAdd()"></div>
  <div class="dialog" role="dialog" aria-labelledby="add-currency-title">
    <header>
      <h2 id="add-currency-title">Add currency</h2>
      <button type="button" class="link close-btn" (click)="closeAdd()" aria-label="Close dialog">✕</button>
    </header>

    @if (error(); as failure) {
      <bb-message-box [messages]="[{ tone: 'error', text: failure }]" />
    }

    <div class="dialog-body">
      <div class="field">
        <label for="currency-select" class="form-label">Currency</label>
        <bb-select
          id="currency-select"
          ariaLabel="Currency to add"
          placeholder="Select a currency…"
          [options]="availableOptions()"
          [(ngModel)]="selectedCurrencyId"
        />
      </div>
    </div>

    <footer class="dialog-actions">
      <button type="button" class="btn btn-secondary" (click)="closeAdd()" [disabled]="busy()">Cancel</button>
      <button class="btn btn-primary" type="button" (click)="save()" [disabled]="!selectedCurrencyId || busy()">
        {{ busy() ? 'Adding…' : 'Add currency' }}
      </button>
    </footer>
  </div>
}

@if (error(); as failure) {
  @if (!adding()) {
    <bb-message-box [messages]="[{ tone: 'error', text: failure }]" />
  }
}

<bb-data-grid fillHeight [gridCode]="'ORG_CURRENCIES'" [columns]="columns" [data]="rows()">
  <ng-template bbCellTemplate="code" let-row>
    {{ row.code }}
    @if (row.isBaseCurrency) {
      <span class="badge">Base</span>
    }
  </ng-template>
  <ng-template bbCellTemplate="format" let-row>
    <code>{{ row.format }}</code>
  </ng-template>
  <ng-template bbCellTemplate="isActive" let-row>
    <button
      type="button"
      class="toggle"
      [class.on]="row.isActive"
      [disabled]="row.isBaseCurrency || busy()"
      [title]="row.isBaseCurrency ? 'The base currency cannot be deactivated' : 'Toggle active'"
      (click)="toggle(row)"
    >
      {{ row.isActive ? 'Active' : 'Inactive' }}
    </button>
  </ng-template>
</bb-data-grid>
