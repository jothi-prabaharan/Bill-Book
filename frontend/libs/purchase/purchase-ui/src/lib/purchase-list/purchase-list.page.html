<bb-register-header
  [title]="pageTitle() || 'Purchase'"
  [code]="register().code"
  [count]="periodRows().length"
  [newLabel]="newTitle()"
  [newRoute]="newRoute()"
/>

<bb-status-tabs label="Status filters" [tabs]="tabs()" [value]="selectedStatus()" (valueChange)="setStatus($event)" />

<section class="register-card">
  <bb-period-filter-bar initialPreset="this-financial-year" [total]="periodTotal()" (rangeChange)="setRange($event)" />

  <bb-data-grid
    register
    fillHeight
    flush
    stackOnPhone
    label="Purchase documents"
    [gridCode]="'PURCHASE_LIST'"
    [columns]="columns"
    [data]="visibleTransactions()"
    (rowClick)="navigateToTransaction($event)"
  >
    <ng-template bbCellTemplate="documentNo" let-row>
      <bb-doc-number [code]="row.code" [number]="row.documentNo" />
    </ng-template>

    <ng-template bbCellTemplate="documentDate" let-row>
      <span class="reg-date">{{ row.documentDate | registerDate }}</span>
    </ng-template>

    <ng-template bbCellTemplate="listStatus" let-row>
      <span class="flex items-center gap-2">
        <span class="tag" [ngClass]="statusTone(row.listStatus)">{{ statusLabel(row.listStatus) }}</span>

        @if (canAllocate(row)) {
          <button
            type="button"
            class="btn btn-ghost whitespace-nowrap"
            [attr.aria-label]="'Allocate credits against ' + row.documentNo"
            (click)="allocate(row, $event)"
          >
            Allocate
          </button>
        }
      </span>
    </ng-template>

    <ng-template bbCellTemplate="taxableAmount" let-row>
      <bb-money-cell [value]="row.taxableAmount" />
    </ng-template>

    <ng-template bbCellTemplate="totalAmount" let-row>
      <bb-money-cell [value]="row.totalAmount" [currency]="row.currencyCode" />
    </ng-template>
  </bb-data-grid>
</section>

<bb-allocation-modal
  [open]="allocateOpen()"
  [target]="allocateTarget()"
  [rows]="allocateRows()"
  [loading]="allocateLoading()"
  [saving]="allocateSaving()"
  [messages]="allocateMessages()"
  [formats]="formatSettings.settings()"
  (save)="onAllocate($event)"
  (dismiss)="closeAllocate()"
></bb-allocation-modal>
