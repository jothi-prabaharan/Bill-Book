<div class="page-header">
  <h1>Purchase Transactions</h1>
  
  <div class="header-actions">
    <div class="field" style="display: inline-block; margin-right: 1rem;">
      <select [(ngModel)]="selectedType" (change)="onTypeChange()" class="input">
        <option value="">All Transactions</option>
        <option value="PurchaseOrder">Purchase Orders</option>
        <option value="GoodsReceipt">Goods Receipts</option>
        <option value="Bill">Bills</option>
        <option value="DebitNote">Debit Notes</option>
      </select>
    </div>

    <a routerLink="/purchase/purchase-orders/new" class="btn btn-primary" style="margin-right: 0.5rem;">New Order</a>
    <a routerLink="/purchase/goods-receipts/new" class="btn btn-primary" style="margin-right: 0.5rem;">New Receipt</a>
    <a routerLink="/purchase/bills/new" class="btn btn-primary" style="margin-right: 0.5rem;">New Bill</a>
    <a routerLink="/purchase/debit-notes/new" class="btn btn-primary">New Debit Note</a>
  </div>
</div>

<div class="card">
  <table class="table">
    <thead>
      <tr>
        <th>Date</th>
        <th>Type</th>
        <th>Number</th>
        <th>Vendor</th>
        <th class="text-right">Amount</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let t of transactions" (click)="navigateToTransaction(t)" class="clickable-row" style="cursor: pointer;">
        <td>{{ t.documentDate | date }}</td>
        <td>{{ t.transactionType }}</td>
        <td>{{ t.documentNo }}</td>
        <td>{{ t.contactName }}</td>
        <td class="text-right">{{ t.totalAmount | number:'1.2-2' }}</td>
        <td><span class="badge">{{ t.status }}</span></td>
      </tr>
      <tr *ngIf="transactions.length === 0">
        <td colspan="6" class="text-center text-muted">No transactions found.</td>
      </tr>
    </tbody>
  </table>
</div>
