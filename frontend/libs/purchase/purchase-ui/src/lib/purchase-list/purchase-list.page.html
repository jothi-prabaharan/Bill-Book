<nav aria-label="Document types" class="flex flex-wrap mb-3 gap-6px">
  <button type="button" (click)="setType('')" [attr.aria-pressed]="selectedType === ''" class="btn btn-secondary text-sm tab-all">All transactions</button>
  
  <span class="tabgrp">
    <button class="btn btn-secondary" type="button" (click)="setType('Bill')" [attr.aria-pressed]="selectedType === 'Bill'">Bills</button>
    <button class="btn btn-secondary" type="button" routerLink="/purchase/bills/new" title="New Bill" aria-label="New Bill"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>
  </span>

  <span class="tabgrp">
    <button class="btn btn-secondary" type="button" (click)="setType('PurchaseOrder')" [attr.aria-pressed]="selectedType === 'PurchaseOrder'">Purchase orders</button>
    <button class="btn btn-secondary" type="button" routerLink="/purchase/purchase-orders/new" title="New Purchase order" aria-label="New Purchase order"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>
  </span>

  <span class="tabgrp">
    <button class="btn btn-secondary" type="button" (click)="setType('GoodsReceipt')" [attr.aria-pressed]="selectedType === 'GoodsReceipt'">Goods receipts</button>
    <button class="btn btn-secondary" type="button" routerLink="/purchase/goods-receipts/new" title="New Goods receipt" aria-label="New Goods receipt"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>
  </span>

  <span class="tabgrp">
    <button class="btn btn-secondary" type="button" (click)="setType('DebitNote')" [attr.aria-pressed]="selectedType === 'DebitNote'">Debit notes</button>
    <button class="btn btn-secondary" type="button" routerLink="/purchase/debit-notes/new" title="New Debit note" aria-label="New Debit note"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>
  </span>
</nav>

<div class="card bg-surface">
    <bb-data-grid [gridCode]="'PURCHASE_LIST'" [columns]="columns" [data]="transactions">
    <ng-template bbCellTemplate="documentDate" let-row="row">
      <span (click)="navigateToTransaction(row)" (keyup.enter)="navigateToTransaction(row)" tabindex="0" class="cursor-pointer block w-full tabular-nums">{{ row.documentDate | date }}</span>
    </ng-template>
    <ng-template bbCellTemplate="transactionType" let-row="row">
      <span (click)="navigateToTransaction(row)" (keyup.enter)="navigateToTransaction(row)" tabindex="0" class="cursor-pointer block w-full">{{ row.transactionType }}</span>
    </ng-template>
    <ng-template bbCellTemplate="documentNo" let-row="row">
      <span (click)="navigateToTransaction(row)" (keyup.enter)="navigateToTransaction(row)" tabindex="0" class="cursor-pointer block w-full">{{ row.documentNo }}</span>
    </ng-template>
    <ng-template bbCellTemplate="contactName" let-row="row">
      <span (click)="navigateToTransaction(row)" (keyup.enter)="navigateToTransaction(row)" tabindex="0" class="cursor-pointer block w-full">{{ row.contactName }}</span>
    </ng-template>
    <ng-template bbCellTemplate="totalAmount" let-row="row">
      <span (click)="navigateToTransaction(row)" (keyup.enter)="navigateToTransaction(row)" tabindex="0" class="cursor-pointer block w-full text-right tabular-nums">{{ row.totalAmount | number:'1.2-2' }}</span>
    </ng-template>
    <ng-template bbCellTemplate="status" let-row="row">
      <span (click)="navigateToTransaction(row)" (keyup.enter)="navigateToTransaction(row)" tabindex="0" class="cursor-pointer block w-full">
        <span class="tag" [ngClass]="{
          'tag-neutral': row.status === 'Posted' || row.status === 'Closed' || row.status === 'PurchaseReturn',
          'tag-accent': row.status === 'Open' || row.status === 'PartlyReceived',
          'tag-outline': row.status === 'Draft' || row.status === 'Void'
        }">{{ row.status }}</span>
      </span>
    </ng-template>
  </bb-data-grid>
</div>
