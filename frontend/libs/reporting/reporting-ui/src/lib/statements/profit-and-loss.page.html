<div class="page-head">
  <h1>Profit &amp; Loss</h1>
</div>

<div class="bb-card statements-card">
  <div *ngIf="loading()">Loading...</div>
  <div *ngIf="data() as d">
    <div *ngFor="let sec of d.sections" class="section">
      <h3>{{ sec.displayName }}</h3>
      <bb-data-grid fillHeight
        class="statement"
        flush
        [label]="sec.displayName"
        [columns]="columns"
        [data]="sec.accounts"
        [sortable]="false"
        [showColumnFilters]="false"
        [showCount]="false"
        [paged]="false"
      >
        <ng-template bbCellTemplate="accountName" let-acc>
          {{ acc.accountCode }} - {{ acc.accountName }}
        </ng-template>
        <ng-template bbCellTemplate="balance" let-acc>
          {{ acc.balance | number:'1.2-2' }}
        </ng-template>
        <ng-template bbGridFooter>
          <tr>
            <th scope="row">Total {{ sec.displayName }}</th>
            <th class="numeric">{{ sec.totalBalance | number:'1.2-2' }}</th>
          </tr>
        </ng-template>
      </bb-data-grid>
    </div>

    <div class="summary">
      <div class="summary__line">
        <strong>Gross Profit</strong>
        <strong>{{ d.grossProfit | number:'1.2-2' }}</strong>
      </div>
      <div class="summary__line summary__line--net">
        <strong>Net Profit</strong>
        <strong>{{ d.netProfit | number:'1.2-2' }}</strong>
      </div>
    </div>
  </div>
</div>
