<div class="page-head">
  <h1>Profit &amp; Loss</h1>
</div>

<div class="bb-card statements-card">
  <div *ngIf="loading()">Loading...</div>
  <div *ngIf="data() as d">
    <div *ngFor="let sec of d.sections" class="section">
      <h3>{{ sec.displayName }}</h3>
      <table style="width: 100%; border-collapse: collapse;">
        <tbody>
          <tr *ngFor="let acc of sec.accounts">
            <td style="padding: 4px 0;">{{ acc.accountCode }} - {{ acc.accountName }}</td>
            <td style="padding: 4px 0; text-align: right;">{{ acc.balance | number:'1.2-2' }}</td>
          </tr>
        </tbody>
        <tfoot>
          <tr>
            <th style="padding: 8px 0; text-align: left; border-top: 1px solid #eee;">Total {{ sec.displayName }}</th>
            <th style="padding: 8px 0; text-align: right; border-top: 1px solid #eee;">{{ sec.totalBalance | number:'1.2-2' }}</th>
          </tr>
        </tfoot>
      </table>
      <br />
    </div>
    
    <div class="summary" style="margin-top: 24px; padding-top: 16px; border-top: 2px solid #ccc;">
      <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
        <strong>Gross Profit</strong>
        <strong>{{ d.grossProfit | number:'1.2-2' }}</strong>
      </div>
      <div style="display: flex; justify-content: space-between; font-size: 1.1em;">
        <strong>Net Profit</strong>
        <strong>{{ d.netProfit | number:'1.2-2' }}</strong>
      </div>
    </div>
  </div>
</div>
