<div class="page-head">
  <h1>Profit &amp; Loss</h1>
</div>

<div class="bb-card statements-card">
  <div *ngIf="loading()">Loading...</div>
  <div *ngIf="data() as d">
    <div *ngFor="let sec of d.sections" class="section">
      <h3>{{ sec.displayName }}</h3>
      <bb-card-table class="statement" [label]="sec.displayName" flush>
        <tbody>
          <tr *ngFor="let acc of sec.accounts">
            <td>{{ acc.accountCode }} - {{ acc.accountName }}</td>
            <td class="num">{{ acc.balance | number:'1.2-2' }}</td>
          </tr>
        </tbody>
        <tfoot>
          <tr>
            <th scope="row">Total {{ sec.displayName }}</th>
            <th class="num">{{ sec.totalBalance | number:'1.2-2' }}</th>
          </tr>
        </tfoot>
      </bb-card-table>
    </div>

    <div class="summary">
      <div class="summary__line">
        <strong>Gross Profit</strong>
        <strong>{{ d.grossProfit | number:'1.2-2' }}</strong>
      </div>
      <div class="summary__line summary__line--net">
        <strong>Net Profit</strong>
        <strong>{{ d.netProfit | number:'1.2-2' }}</strong>
      </div>
    </div>
  </div>
</div>
