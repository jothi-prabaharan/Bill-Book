<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Bill-Book</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="assets/bill-book-logo.svg" />
    <link rel="alternate icon" type="image/png" href="assets/bill-book-mark.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&display=swap"
    />
    <!-- PWA manifest and mobile/desktop app support -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f3f2f2" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Bill-Book" />
    <meta name="application-name" content="Bill-Book" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('/sw.js', { scope: '/' })
            .catch((err) => {
              console.warn('[PWA] ServiceWorker registration failed:', err);
            });
        });
      }
    </script>
    <!--
      Deployment settings, read before the application starts. The file shipped
      with the build sets nothing, so the app uses its built-in defaults; a
      deployment replaces it with one naming the API origin. A classic script in
      the head runs before the bundle, which Angular loads as deferred modules.
      See libs/shared/api-client/src/lib/runtime-config.ts.
    -->
    <script src="config.js"></script>
  </head>
  <body>
    <bb-root></bb-root>
  </body>
</html>
