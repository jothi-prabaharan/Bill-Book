<div class="layout">
  <aside>
    <a class="brand" routerLink="/overview">
      <img src="assets/bill-book-mark.png" alt="Bill-Book Logo" class="brand-logo" />
      <span class="brand-name">Bill-Book <span class="brand-suffix">docs</span></span>
    </a>
    @for (section of docs; track section.title) {
      <h2>{{ section.title }}</h2>
      <ul>
        @for (page of section.pages; track page.slug) {
          <li>
            <a [routerLink]="'/' + page.slug" routerLinkActive="active">
              {{ page.title }}
              @if (page.status !== 'built') {
                <span class="tag" [class.planned]="page.status === 'planned'">
                  {{ page.status }}
                </span>
              }
            </a>
          </li>
        }
      </ul>
    }
  </aside>
  <main><router-outlet /></main>
</div>
