# The whole product on your own PCs — one PC, or one PC per part. Built for
# Windows 11 with Docker Desktop, and runs the same on Linux or a Mac.
#
#   cd deploy/local
#   powershell -ExecutionPolicy Bypass -File setup.ps1     (once: writes .env)
#   docker compose up -d --build
#
# Each service belongs to one part, and COMPOSE_PROFILES in .env says which
# parts this PC runs:
#
#   db        PostgreSQL
#   services  the eight APIs, and the migrate and first-branch jobs
#   worker    the costing worker
#   gateway   the YARP gateway
#   web       nginx serving the four browser apps
#   tunnel    Cloudflare Tunnel — the public address; beside web
#
# One PC runs "db,services,worker,gateway,web". Split across PCs, each runs
# one and names the others by address (DB_HOST, SERVICES_HOST, GATEWAY_HOST); left
# empty, an address means "on this PC". The uploaded files can live on a
# further PC again, an SFTP server (SFTP_HOST). README.md has both layouts.
#
# The same images as deploy/azure, from the same backend/Dockerfile. What differs
# is only what Azure would have supplied: Postgres runs in a container, files go
# to a volume instead of Blob Storage, secrets come from .env instead of Key
# Vault, and events are logged rather than sent, because nothing consumes one yet.

name: billbook

# ---------------------------------------------------------------------------
# Shared settings
# ---------------------------------------------------------------------------

x-backend-env: &backend-env
  # Not "Production", deliberately. A Production service refuses to start
  # without Key Vault, which is right on Azure and has no equivalent here — the
  # secrets arrive from .env through configuration instead. Not "Development"
  # either: that returns raw database errors to callers, and this machine is
  # meant to be reachable from the internet.
  ASPNETCORE_ENVIRONMENT: SelfHosted
  # The costing worker is a plain .NET host, which reads this name and ignores
  # the ASP.NET one — without it, it would think it was Production.
  DOTNET_ENVIRONMENT: SelfHosted
  # Secrets are not marked required here, because a PC that runs only the web
  # apps is deliberately not given them; a service started without one fails
  # at startup naming the setting.
  ConnectionStrings__AdminDatabase: Host=${DB_HOST:-db};Port=${DB_PORT:-5432};Database=EP_Admin;Username=postgres;Password=${POSTGRES_PASSWORD:-}
  ConnectionStrings__TenantDatabase: Host=${DB_HOST:-db};Port=${DB_PORT:-5432};Database=IN000001;Username=postgres;Password=${POSTGRES_PASSWORD:-}
  Jwt__SigningKey: ${JWT_SIGNING_KEY:-}
  Internal__ApiKey: ${INTERNAL_API_KEY:-}
  Encryption__Key: ${ENCRYPTION_KEY:-}
  # Uploaded files: an SFTP server when SFTP_HOST is set, this folder
  # otherwise.
  FileStorage__LocalRoot: /data/files
  Storage__Sftp__Host: ${SFTP_HOST:-}
  Storage__Sftp__Port: ${SFTP_PORT:-22}
  Storage__Sftp__Username: ${SFTP_USERNAME:-}
  Storage__Sftp__Password: ${SFTP_PASSWORD:-}
  Storage__Sftp__Root: ${SFTP_ROOT:-/}
  Storage__Sftp__HostKeySha256: ${SFTP_HOST_KEY:-}
  # Every inter-service URL on every service, for the reason deploy/azure gives:
  # several appsettings.json files carry localhost defaults, and inside a
  # container localhost is the container itself — a call that quietly reaches
  # nothing. Each service listens on its own port, the same inside the
  # container and on the PC, so one address works from this PC's containers
  # (by name) and from the gateway's PC (by SERVICES_HOST) alike.
  Master__BaseUrl: http://${SERVICES_HOST:-master}:7501
  Accounting__BaseUrl: http://${SERVICES_HOST:-accounting}:7502
  Inventory__BaseUrl: http://${SERVICES_HOST:-inventory}:7503
  Sales__BaseUrl: http://${SERVICES_HOST:-sales}:7504
  Purchase__BaseUrl: http://${SERVICES_HOST:-purchase}:7505
  Customer__BaseUrl: http://${SERVICES_HOST:-customer}:7506
  Reporting__BaseUrl: http://${SERVICES_HOST:-reporting}:7507
  Printing__BaseUrl: http://${SERVICES_HOST:-printing}:7508

x-master-env: &master-env
  <<: *backend-env
  # Master and the services it seeds are always on the same PC.
  Seeding__Accounting: http://accounting:7502
  Seeding__Inventory: http://inventory:7503
  Seeding__Sales: http://sales:7504
  Seeding__Purchase: http://purchase:7505
  Seeding__Reporting: http://reporting:7507
  Seeding__Printing: http://printing:7508
  Seeding__Customer: http://customer:7506
  # Where links in invitation and password-reset emails point.
  App__BaseUrl: ${APP_URL:-http://localhost:8081}
  Portal__BaseUrl: ${PORTAL_URL:-http://localhost:8082}
  # The first owner, their business and its first branch, created once while
  # the database has no users at all. setup.ps1 fills these in.
  Bootstrap__OwnerEmail: ${BOOTSTRAP_OWNER_EMAIL:-}
  # Who may sign in to apps/admin (D-01). On one PC the owner runs the platform
  # too, so it defaults to the owner's address.
  Bootstrap__OperatorEmails: ${BOOTSTRAP_OPERATOR_EMAILS:-${BOOTSTRAP_OWNER_EMAIL:-}}
  Bootstrap__OwnerPassword: ${BOOTSTRAP_OWNER_PASSWORD:-}
  Bootstrap__OwnerName: ${BOOTSTRAP_OWNER_NAME:-Owner}
  Bootstrap__CompanyName: ${BOOTSTRAP_COMPANY_NAME:-My Business}

# A service that runs after the migration has finished, and comes back after a
# crash or a reboot. "required: false" because on the gateway's own PC there
# is no migration job to wait for — it ran on the services PC.
x-service: &service
  profiles: [services]
  restart: unless-stopped
  depends_on:
    migrate:
      condition: service_completed_successfully
      required: false
  volumes:
    - files:/data/files

# One definition per image. backend/Dockerfile builds any backend project; the
# two build arguments are the only difference between them.
x-build: &build
  context: ../../backend
  dockerfile: Dockerfile

services:

  # -------------------------------------------------------------------------
  # Database
  # -------------------------------------------------------------------------

  db:
    image: postgres:16-alpine
    profiles: [db]
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      # UTF8 so Tamil and Chinese names store as characters. Master creates
      # EP_Admin and IN000001 itself on first start.
      POSTGRES_INITDB_ARGS: --encoding=UTF8
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
      - ./db:/scripts:ro
      # Read-only, so the nightly backup can take the uploaded files with it.
      - files:/data/files:ro
    # 5433 rather than 5432 so a Postgres already installed on Windows does not
    # collide with it. Loopback unless BIND_ADDRESS opens it — which the
    # database's own PC does when the services run on another.
    ports:
      - ${BIND_ADDRESS:-127.0.0.1}:5433:5432
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres]
      interval: 5s
      timeout: 5s
      retries: 20

  # The upload volume is created owned by root, and the services run as the
  # image's unprivileged `app` user (uid 1654). This hands the folder over once,
  # before anything writes to it, rather than running the services as root.
  files-init:
    image: billbook/master:local
    profiles: [services]
    user: "0"
    entrypoint: [chown, "1654:1654", /data/files]
    volumes:
      - files:/data/files
      # Only for putting uploaded files back from a backup (README.md).
      - ./backups:/backups:ro
    restart: "no"

  # Applies every schema's migrations once, then exits. The services also
  # migrate on start; left to that alone, eight of them would race to migrate
  # the same database. After this they find nothing to do.
  migrate:
    image: billbook/master:local
    profiles: [services]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
        # On another PC when split: then nothing here can wait on its health,
        # and a database that is not up yet fails this job, which says so.
        required: false
      files-init:
        condition: service_completed_successfully
    environment:
      <<: *master-env
      Migrations__ExitWhenDone: "true"

  # -------------------------------------------------------------------------
  # Services
  # -------------------------------------------------------------------------

  master:
    <<: *service
    image: billbook/master:local
    build:
      <<: *build
      args: { PROJECT: Api/Master/Master.Api, ASSEMBLY: Master.Api }
    environment:
      <<: *master-env
      ASPNETCORE_HTTP_PORTS: "7501"
    # Every service is published so the gateway can reach it from its own PC.
    # Loopback unless BIND_ADDRESS opens it.
    ports:
      - ${BIND_ADDRESS:-127.0.0.1}:7501:7501

  accounting:
    <<: *service
    image: billbook/accounting:local
    build:
      <<: *build
      args: { PROJECT: Api/Accounting/Accounting.Api, ASSEMBLY: Accounting.Api }
    environment:
      <<: *backend-env
      ASPNETCORE_HTTP_PORTS: "7502"
    ports:
      - ${BIND_ADDRESS:-127.0.0.1}:7502:7502

  inventory:
    <<: *service
    image: billbook/inventory:local
    build:
      <<: *build
      args: { PROJECT: Api/Inventory/Inventory.Api, ASSEMBLY: Inventory.Api }
    environment:
      <<: *backend-env
      ASPNETCORE_HTTP_PORTS: "7503"
    ports:
      - ${BIND_ADDRESS:-127.0.0.1}:7503:7503

  sales:
    <<: *service
    image: billbook/sales:local
    build:
      <<: *build
      args: { PROJECT: Api/Sales/Sales.Api, ASSEMBLY: Sales.Api }
    environment:
      <<: *backend-env
      ASPNETCORE_HTTP_PORTS: "7504"
    ports:
      - ${BIND_ADDRESS:-127.0.0.1}:7504:7504

  purchase:
    <<: *service
    image: billbook/purchase:local
    build:
      <<: *build
      args: { PROJECT: Api/Purchase/Purchase.Api, ASSEMBLY: Purchase.Api }
    environment:
      <<: *backend-env
      ASPNETCORE_HTTP_PORTS: "7505"
    ports:
      - ${BIND_ADDRESS:-127.0.0.1}:7505:7505

  customer:
    <<: *service
    image: billbook/customer:local
    build:
      <<: *build
      args: { PROJECT: Api/Customer/Customer.Api, ASSEMBLY: Customer.Api }
    environment:
      <<: *backend-env
      ASPNETCORE_HTTP_PORTS: "7506"
    ports:
      - ${BIND_ADDRESS:-127.0.0.1}:7506:7506

  reporting:
    <<: *service
    image: billbook/reporting:local
    build:
      <<: *build
      args: { PROJECT: Api/Reporting/Reporting.Api, ASSEMBLY: Reporting.Api }
    environment:
      <<: *backend-env
      ASPNETCORE_HTTP_PORTS: "7507"
    ports:
      - ${BIND_ADDRESS:-127.0.0.1}:7507:7507

  printing:
    <<: *service
    image: billbook/printing:local
    build:
      <<: *build
      args: { PROJECT: Api/Printing/Printing.Api, ASSEMBLY: Printing.Api }
    environment:
      <<: *backend-env
      ASPNETCORE_HTTP_PORTS: "7508"
    ports:
      - ${BIND_ADDRESS:-127.0.0.1}:7508:7508

  # Needs the database and, by SERVICES_HOST, Master and Accounting. Nothing
  # calls it, so it publishes no port.
  costing-worker:
    <<: *service
    profiles: [worker]
    image: billbook/costing-worker:local
    build:
      <<: *build
      args: { PROJECT: worker/CostingEngine.Worker, ASSEMBLY: CostingEngine.Worker }
    environment: *backend-env

  gateway:
    <<: *service
    profiles: [gateway]
    image: billbook/gateway:local
    build:
      <<: *build
      args: { PROJECT: Gateway/Gateway.Api, ASSEMBLY: Gateway.Api }
    environment:
      <<: *backend-env
      ReverseProxy__Clusters__master__Destinations__d1__Address: http://${SERVICES_HOST:-master}:7501/
      ReverseProxy__Clusters__accounting__Destinations__d1__Address: http://${SERVICES_HOST:-accounting}:7502/
      ReverseProxy__Clusters__inventory__Destinations__d1__Address: http://${SERVICES_HOST:-inventory}:7503/
      ReverseProxy__Clusters__sales__Destinations__d1__Address: http://${SERVICES_HOST:-sales}:7504/
      ReverseProxy__Clusters__purchase__Destinations__d1__Address: http://${SERVICES_HOST:-purchase}:7505/
      ReverseProxy__Clusters__customer__Destinations__d1__Address: http://${SERVICES_HOST:-customer}:7506/
      ReverseProxy__Clusters__reporting__Destinations__d1__Address: http://${SERVICES_HOST:-reporting}:7507/
      ReverseProxy__Clusters__printing__Destinations__d1__Address: http://${SERVICES_HOST:-printing}:7508/
    # Published for the web PC when split; loopback unless BIND_ADDRESS opens
    # it. The browser never calls it directly — nginx forwards /api to it — so
    # the browser only ever talks to one origin per app and CORS never comes
    # into it.
    ports:
      - ${BIND_ADDRESS:-127.0.0.1}:8080:8080
    volumes: []

  # Seeds the first branch's master data once every service is up. See
  # seed/first-branch.sh. Borrows the web image only because it has curl.
  first-branch:
    image: billbook/web:local
    profiles: [services]
    restart: "no"
    entrypoint: [sh, /seed/first-branch.sh]
    environment:
      BOOTSTRAP_OWNER_EMAIL: ${BOOTSTRAP_OWNER_EMAIL:-}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
    volumes:
      - ./seed:/seed:ro
    depends_on:
      - master
      - accounting
      - inventory
      - sales
      - purchase
      - reporting
      - printing

  # -------------------------------------------------------------------------
  # Web apps
  # -------------------------------------------------------------------------

  # All four Angular apps in one nginx, one port each, each forwarding /api to
  # the gateway. Built from the frontend source inside the image, so the PC
  # needs no Node.js.
  web:
    image: billbook/web:local
    profiles: [web]
    build:
      context: ../../frontend
      dockerfile: ../deploy/local/web/Dockerfile
      additional_contexts:
        config: ./web
    restart: unless-stopped
    environment:
      # Where nginx forwards /api. The gateway's container on this PC, or the
      # gateway's PC when split.
      GATEWAY_UPSTREAM: http://${GATEWAY_HOST:-gateway}:8080
    depends_on:
      gateway:
        condition: service_started
        required: false
    # Loopback by default: the internet reaches these through the tunnel, not
    # through the PC's own address. BIND_ADDRESS=0.0.0.0 in .env opens them to
    # other PCs on the local network as well.
    ports:
      - ${BIND_ADDRESS:-127.0.0.1}:8081:8081   # web
      - ${BIND_ADDRESS:-127.0.0.1}:8082:8082   # portal
      - ${BIND_ADDRESS:-127.0.0.1}:8083:8083   # admin
      - ${BIND_ADDRESS:-127.0.0.1}:8084:8084   # docs

  # -------------------------------------------------------------------------
  # Public access
  # -------------------------------------------------------------------------

  # An outbound connection to Cloudflare, which is how the site is reached from
  # the internet with no static IP, no port opened on the router, and HTTPS
  # handled at Cloudflare. Off until .env sets COMPOSE_PROFILES=tunnel and a
  # token; which host name goes to which port is set in the Cloudflare
  # dashboard (see README.md).
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      web:
        condition: service_started
        required: false

volumes:
  pgdata:
  files:
