# One server per app, one port each. Cloudflare Tunnel maps a host name to each
# port (README.md), and on this PC they are http://localhost:8081 to 8084.
#
# Every app forwards /api to the gateway on its own origin. The apps are built
# to do exactly that when config.js names no API address — which the shipped
# config.js does not — so the browser sees one origin per app, no CORS
# preflight is ever sent, and the gateway needs no public host name of its own.

# Re-resolve the gateway through Docker's DNS rather than once at startup: a
# recreated gateway container comes back on a new address, and nginx would
# otherwise keep sending to the old one until it was restarted too.
resolver 127.0.0.11 valid=10s ipv6=off;

# Cloudflare terminates HTTPS and says so in X-Forwarded-Proto. Passed on as
# given, so a link the API builds from the request says https; a request made
# straight to this PC has no such header and is plain http.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 8081;
    root /usr/share/nginx/web;
    include /etc/nginx/app.conf;
}

server {
    listen 8082;
    root /usr/share/nginx/portal;
    include /etc/nginx/app.conf;
}

server {
    listen 8083;
    root /usr/share/nginx/admin;
    include /etc/nginx/app.conf;
}

server {
    listen 8084;
    root /usr/share/nginx/docs;
    include /etc/nginx/app.conf;
}
