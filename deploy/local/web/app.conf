# What every app's server does. Included by nginx.conf once per app.
#
# The security headers are repeated in each location rather than set once for
# the server, because nginx drops the server's add_header lines from any
# location that adds a header of its own — and every location here does.

server_tokens off;

# An attachment upload is the largest request the product takes.
client_max_body_size 25m;

# ^~ so the file-type rules below never claim an API path such as
# /api/reports/x.json — a regex location otherwise wins over a plain prefix.
location ^~ /api/ {
    # Filled in when the container starts, from GATEWAY_UPSTREAM
    # (docker-compose.yml): the gateway on this PC, or on its own.
    set $gateway ${GATEWAY_UPSTREAM};
    proxy_pass $gateway;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    # A report export can run for a while; the default 60 seconds would cut it
    # off with a 504 the API never sent.
    proxy_read_timeout 300s;
}

# The one file that may differ per deployment. Never cached, so a change to it
# reaches every browser on the next load.
location = /config.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header X-Content-Type-Options nosniff always;
}

# Angular fingerprints these (main-ABC123.js), so a new build has new names and
# an old name never changes content. Quoted because nginx reads an unquoted
# brace as the start of a block.
location ~* "-[A-Z0-9]{8}\.(js|css)$" {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
}

# The docs app fetches its pages as Markdown.
location ~* \.md$ {
    default_type "text/markdown; charset=utf-8";
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
}

# The install manifest. nginx's own type list does not name it, and with
# nosniff a browser must be told the right type rather than guess it.
location ~* \.webmanifest$ {
    default_type application/manifest+json;
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
}

# Any other file: a missing one is a 404, not the app's index page, so a broken
# image link shows as broken rather than as HTML parsed as a picture.
location ~* \.(js|css|ico|png|jpe?g|gif|svg|webp|woff2?|ttf|json|map|txt)$ {
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
}

# Everything else is a route inside the app, which the app draws itself.
location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
}
